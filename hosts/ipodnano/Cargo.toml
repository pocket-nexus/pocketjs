[package]
name = "pocketjs-ipodnano"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["staticlib", "rlib"]
test = false
bench = false

[dependencies]
microts = { path = "../../engine/crates/microts" }
pocketjs-core = { path = "../../engine/core" }

[target.'cfg(target_os = "none")'.dependencies]
microts = { path = "../../engine/crates/microts", features = ["critical-section"] }
linked_list_allocator = { version = "0.10.5", default-features = false }
critical-section = { version = "1.2", features = ["restore-state-bool"] }

[features]
# The full-tree layout oracle, linked by the host preview only.
counters = ["microts/counters"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = false
debug = 1
