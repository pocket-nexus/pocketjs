[package]
name = "pocket-desktop-host"
edition = "2024"
description = "PocketJS portable Rust renderer and worker-owned desktop runtime"

version.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
pocket-spec = { workspace = true, default-features = true }
pocket-runtime = { workspace = true, default-features = true }
pocket-drivers = { workspace = true, default-features = true }
pocket-web-render = { workspace = true, default-features = true }
pocketjs-core = { workspace = true, default-features = true }
pocket-mod = { workspace = true, default-features = true }
pocket-ui-surface = { workspace = true, default-features = true }
pocket-text = { workspace = true, default-features = true }
pocket-ui-wgpu = { workspace = true, default-features = true }
pocket3d = { workspace = true }
wgpu = "25"
winit = "0.30"
arboard = { version = "3", default-features = false }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
