[package]
name = "pocket-desktop-host"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "PocketJS portable Rust renderer and worker-owned desktop runtime"

[dependencies]
pocket-desktop-native = { path = "../../engine/crates/pocket-desktop-native" }
libloading = "0.8"
sha2 = "0.10"
pocketjs-core = { path = "../../engine/core", features = ["std"] }
pocket-mod = { path = "../../engine/crates/pocket-mod" }
pocket-ui-surface = { path = "../../engine/crates/pocket-ui-surface" }
pocket-text = { path = "../../engine/crates/pocket-text" }
pocket-ui-wgpu = { path = "../../engine/crates/pocket-ui-wgpu" }
pocket3d = { path = "../../engine/pocket3d/crates/pocket3d", default-features = false }
wgpu = "25"
winit = "0.30"
arboard = { version = "3", default-features = false }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
debug = false

[build-dependencies]
sha2 = "0.10"
serde_json = "1"

[[example]]
name = "native-fixture"
path = "../../engine/crates/pocket-desktop-native/examples/native-fixture.rs"
crate-type = ["cdylib"]
