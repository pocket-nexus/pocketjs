[package]
name = "pocketjs-gba-bake"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
# `counters` links the full-tree layout oracle: every baked frame is checked
# against a fresh solve of the whole tree on the host (device-identical math).
microts = { path = "../../../engine/crates/microts", features = ["counters"] }
pocketjs-core = { path = "../../../engine/core" }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
