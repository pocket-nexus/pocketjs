[package]
name = "pocketjs-gba"
edition = "2021"

version.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PocketJS gba component"
publish = false

[dependencies]
pocket-spec = { workspace = true, default-features = true }
microts = { workspace = true, default-features = true, features = ["critical-section", "runtime"] }
pocketjs-core = { workspace = true, default-features = true }
pocket-runtime = { workspace = true, default-features = true }
pocket-drivers = { workspace = true, default-features = true }
pocket-package = { workspace = true, default-features = true }
linked_list_allocator = { version = "0.10.5", default-features = false }
critical-section = { version = "1.2", features = ["restore-state-bool"] }

[[bin]]
name = "gba-hero"
path = "src/main.rs"
test = false
bench = false
