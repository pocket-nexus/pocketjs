# Single canonical runtime static archive for the armv6k libctru program.
# Standalone nightly workspace uses build-std core/alloc (see .cargo/config.toml).
[package]
name = "pocketjs-3ds-core"
edition = "2021"

version.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PocketJS 3ds core component"
publish = false

[lib]
name = "pocketjs_3ds_core"
crate-type = ["staticlib"]

[dependencies]
pocket-runtime-cabi = { workspace = true }
pocket-package = { workspace = true, default-features = true }
