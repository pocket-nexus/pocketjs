[package]
name = "pocketjs-idf-ui-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
pocket-runtime-cabi = { path = "../../../../engine/runtime-cabi", default-features = false, features = ["legacy-idf"] }

[features]
default = ["std"]
std = ["pocket-runtime-cabi/std"]

[profile.release]
codegen-units = 16
lto = false
opt-level = 3
panic = "abort"

[workspace]
