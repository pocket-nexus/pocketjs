[package]
name = "pocket-idf-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
[lib]
crate-type = ["rlib", "staticlib"]
[dependencies]
pocket-runtime-cabi = { path = "../../../../engine/runtime-cabi", default-features = false }
pocket-render-esp-ppa = { path = "../../../../platforms/esp-idf/render-ppa", features = ["cabi"] }
[features]
default = ["std"]
std = ["pocket-runtime-cabi/std"]
[profile.release]
codegen-units = 16
lto = false
opt-level = 3
panic = "abort"
[workspace]
