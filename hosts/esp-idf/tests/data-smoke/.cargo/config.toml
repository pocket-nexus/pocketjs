[build]
target = "riscv32imafc-esp-espidf"

[target.'cfg(target_os = "espidf")']
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = ["--cfg", "espidf_time64"]

[env]
MCU = "esp32p4"
ESP_IDF_VERSION = "v5.5.3"
# Tools install into this example's .embuild by default; set IDF_TOOLS_PATH
# to reuse an existing espressif tools dir (the cc/ar wrappers honor it).
ESP_IDF_TOOLS_INSTALL_DIR = "workspace"
CC_riscv32imafc_esp_espidf = { value = "tools/data-smoke-cc", relative = true }
AR_riscv32imafc_esp_espidf = { value = "tools/data-smoke-ar", relative = true }
CFLAGS_riscv32imafc_esp_espidf = "-mabi=ilp32f -march=rv32imafc_zicsr_zifencei_xesppie -fno-pic -fno-PIC -Wno-error=incompatible-pointer-types"
# The vendored sqlite3.c, tuned for the device (docs/DB.md "ESP32 / ESP-IDF").
LIBSQLITE3_FLAGS = "-DSQLITE_TEMP_STORE=3 -DSQLITE_DEFAULT_MEMSTATUS=0 -DSQLITE_MAX_MMAP_SIZE=0 -DSQLITE_OMIT_WAL -DSQLITE_OMIT_LOAD_EXTENSION -Dlstat=stat"
