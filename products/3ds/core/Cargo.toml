# Product runtime archive with private recovery package inspection and the
# native program the QuickJS facade composes. The minimal program
# (programs/3ds) links the native program without this wrapper.
[package]
name = "pocketjs-3ds-core"
edition = "2021"

version.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PocketJS 3ds core component"
publish = false

[lib]
name = "pocketjs_3ds_core"
crate-type = ["staticlib"]

[dependencies]
pocket-archive = { workspace = true }
# No built-in output: products/3ds registers the PICA renderer and both
# displays. platforms/3ds/hooks.c supplies the six pocket_host_* hooks.
pocket-native-program = { workspace = true, features = ["host-backend", "host-hooks"] }
pocket-drivers = { workspace = true, default-features = true }
pocket-runtime = { workspace = true, default-features = true }
pocket-package = { workspace = true, default-features = true }
