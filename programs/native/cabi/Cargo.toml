# Compatibility program archive for existing C shells.
# Runtime state and generated UI operations belong to pocket-runtime-cabi.
# Program recipes supply compiler, platform hooks, and rendering configuration.

[package]
name = "pocketjs-ui-cabi"
edition = "2021"

version.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true
description = "C compatibility embedding for PocketJS native hosts"
publish = false

[lib]
# Compatibility name: device toolchains and custom Nokia E7 cores already
# consume this Rust crate and archive as pocketjs_symbian_core. Renaming the
# linked artifact is a separate ABI migration.
name = "pocketjs_symbian_core"
crate-type = ["rlib", "staticlib"]

[features]
default = ["std", "standalone-extension-provider"]
std = ["pocket-runtime-cabi/std"]
standalone-extension-provider = ["pocket-runtime-cabi/standalone-extension-provider"]
# Reuse the no_std C ABI on Mach-O targets whose OS cfg is not `none`.
bare-platform = []
# Compile the fixed-function OpenGL ES 1.1 pipeline instead of the ES 2 one,
# for GPUs that predate shaders (the original iPhone's PowerVR MBX Lite).
gles1 = ["pocket-runtime-cabi/gles1"]
# Validate the GL error queue around every frame. Debug builds do this already;
# release builds opt in because mobile drivers can synchronize the GPU here.
gl-frame-validation = ["pocket-runtime-cabi/gl-frame-validation"]
# Omit the GLES backend for framebuffer-only hosts such as Windows CE/GDI.
# The C ABI keeps its GL entry points, but they return failure without pulling
# graphics symbols into the native link.
software-only = ["pocket-runtime-cabi/software-only"]
# Route no_std allocations through host-owned functions. Windows CE hosts use
# this to avoid depending on the C runtime's allocator ABI.
host-allocator = []
# Report native boot checkpoints to hosts that expose pocket_host_boot_stage.
boot-stage = ["pocket-runtime-cabi/boot-stage"]
# Allow an in-process harness crate to access an already initialized retained Ui
# singleton through an explicit unsafe contract. Production hosts leave this disabled.
harness-access = ["pocket-runtime-cabi/harness-access"]

[dependencies]
pocket-spec = { workspace = true, default-features = true }
pocket-runtime-cabi = { workspace = true, features = ["legacy-ui"] }
pocket-drivers = { workspace = true, default-features = true }
pocket-runtime = { workspace = true, default-features = true }
pocket-package = { workspace = true, default-features = true }
pocket-raster = { workspace = true, default-features = true }
pocket-gles = { workspace = true, default-features = true }
pocket-gles1 = { workspace = true, default-features = true }
pocket-gles2 = { workspace = true, default-features = true }
