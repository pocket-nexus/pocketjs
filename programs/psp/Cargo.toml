# pocketjs-psp — the PSP EBOOT: QuickJS + pocketjs-core + sceGu backend.
#
# Build via tools/psp.ts: the selected build-std compiler with the
# toolchain `pocket target add psp` installs from tools/build/toolchains/psp.ts
# (PSP_SDK, cargo-psp, QUICKJS_PREBUILT_LIB) plus RUSTFLAGS -A linker-messages,
# RUST_PSP_TARGET=targets/mipsel-sony-psp.json and RUST_PSP_ABORT_ONLY=1.
#
# libquickjs-sys links the prebuilt archive QUICKJS_PREBUILT_LIB names. The
# manifest's `quickjs` component is the archive pocket-nexus/quickjs-rs
# publishes as prebuilt-psp-<commit> for the revision below; move both together.
#
# Memory (docs/DESIGN.md "Memory (the blocker fix)" [R]): the psp crate is built
# with `external-global-alloc` (gates out rust-psp's one-kernel-object-per-
# allocation SystemAlloc #[global_allocator] AND its #[alloc_error_handler]);
# programs/psp/src/allocator.rs supplies the allocator; allocation failure uses the
# default Rust handler and rust-psp panic-abort. The single-kernel-block arena
# serves QuickJS (qjs_alloc.rs) and newlib malloc (c_heap.rs).

[package]
name = "pocketjs-psp"
edition = "2021"

version.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PocketJS psp component"
publish = false

[dependencies]
pocket-psp-alloc.workspace = true
pocket-psp-quickjs-alloc.workspace = true
pocket-psp-audio.workspace = true
pocket-psp-display.workspace = true
pocket-psp-system.workspace = true
pocket-psp-input.workspace = true
pocket-psp-io.workspace = true
pocket-spec = { workspace = true, default-features = true }
pocket-psp-render = { workspace = true, default-features = true }
pocket-psp-ge = { workspace = true, default-features = true }
psp = { git = "https://github.com/pocket-nexus/rust-psp.git", rev = "675ff56fd94b892ca1794e1f6ec8066a89b48d20", features = ["external-c-heap", "abort-only", "external-global-alloc"] }
libquickjs-sys = { git = "https://github.com/pocket-nexus/quickjs-rs.git", rev = "a5cac5d8631bdc068b43af93355b9f82d666949e" }
pocketjs-core = { workspace = true, default-features = true }
pocket-runtime = { workspace = true, default-features = true }
pocket-runtime-cabi = { workspace = true, features = ["external-runtime"] }
pocket-drivers = { workspace = true, default-features = true }
pocket-package = { workspace = true, default-features = true }

[build-dependencies]
pocket-spec = { workspace = true, default-features = true }
pocket-profile-build.workspace = true
cc = "1"


[features]
# E2E frame-dump build for tests/e2e/ppsspp.ts (dumps frames to ms0:/dc_cap).
capture = []
# PSP-side microsecond timing summary for tools/bench-ppsspp.ts.
bench = []

# The generic runtime (tools/runtime/psp.ts): no embedded app; the game is
# app.pocket beside the EBOOT, read at boot (src/package_file.rs).
runtime = []

# Explicit validation only: mailbox polling introduces main-thread host0 IO.
devtools-offload = []
