[package]
name = "pocket-sifli-runtime"
edition = "2021"
version.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PocketJS SiFli runtime archive"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]
[dependencies]
pocket-archive = { workspace = true, features = ["software-renderer"] }
pocket-render-sifli-epic = { workspace = true, default-features = true, features = ["cabi"] }
[dev-dependencies]
# tests/physics.rs drives a runtime through the exported symbols.
pocket-drivers = { workspace = true, default-features = true }
pocket-runtime = { workspace = true, default-features = true }
[features]
default = ["std"]
std = ["pocket-archive/std"]
