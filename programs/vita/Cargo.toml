[package]
name = "pocketjs-vita"
edition = "2021"

version.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PocketJS vita component"
publish = false

[dependencies]
pocket-vita-audio.workspace = true
pocket-vita-input.workspace = true
pocket-vita-net.workspace = true
pocket-vita-io.workspace = true
pocket-vita-system.workspace = true
pocket-spec = { workspace = true, default-features = true }
# Vita dependencies. vita2d ships precompiled GXM shaders, so VPKs remain
# self-contained and do not require a separately extracted libshacccg.suprx.
vitasdk-sys = { version = "0.3.3", features = ["SceAudio_stub", "SceCtrl_stub", "SceGxm_stub", "SceKernelThreadMgr_stub", "SceLibKernel_stub", "SceNet_stub", "SceNetCtl_stub", "SceSysmodule_stub", "SceTouch_stub"] }
vita2d-sys = "0.1.1"

libquickjs-sys = { git = "https://github.com/pocket-nexus/quickjs-rs.git", rev = "ba5bdd0dc013518768e76cd9e05cd30ed53dd35b" }
pocketjs-core = { workspace = true, default-features = true }
pocket-drivers = { workspace = true, default-features = true }
pocket-runtime = { workspace = true, default-features = true }
pocket-archive = { workspace = true, default-features = true }
pocket-package = { workspace = true, default-features = true }
pocket-media = { workspace = true, default-features = true }
pocket-raster = { workspace = true, default-features = true }
pocket-vita-render = { workspace = true, default-features = true }

[build-dependencies]
pocket-spec = { workspace = true, default-features = true }
pocket-profile-build.workspace = true
cc = "1"

[features]
capture = []
bench = []
# The generic runtime (tools/runtime/vita.ts): no embedded app; the game is
# app0:app.pkb, read at startup (src/package_file.rs).
runtime = []
# Interrupt guest JavaScript after 5 s of evaluation or 250 ms of one frame
# turn (src/instance.rs). A program binary that keeps a native menu usable
# after a guest loop enables it; the stock program does not.
guest-deadline = []

[package.metadata.vita]
# The Vita backend supplies VITA_DEFAULT_TITLE_ID from the plan's app.id. Keeping the
# reusable runtime free of a static id prevents separate apps from replacing
# one another on real hardware and in Vita3K.
title_name = "PocketJS"
# tools/vita-package.ts owns the final VPK asset merge. Keeping cargo-vita's
# intermediate package asset-free prevents a second, divergent packaging path.

# vita-elf-create consumes sceUserMainThreadStackSize from the ELF symbol
# table. The release default strips that symbol before conversion and falls
# back to Vita's 4 KiB stack, which is too small for QuickJS.
[package.metadata.vita.profile.release]
strip_symbols = false
