name: Deploy sites

# Publish the sites to Cloudflare on every push to main (and on demand):
# the PocketJS site (pocketjs.dev and pocketjs.pocket.nexus), the Pocket
# Nexus homepage (pocket.nexus), the Pocket3D homepage (3d.pocket.nexus) and
# the MicroTS site (microts.pocket.nexus).
# Requires two repo secrets:
# CLOUDFLARE_API_TOKEN (a scoped "Edit Cloudflare Workers" token) and
# CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-pocketjs-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: pocketjs.dev
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The site copies hosts/web/pocketjs.wasm (a gitignored build artifact), so
      # CI must build it from engine/core/wasm first. Stable Rust is enough (no nightly
      # features); wasm32-unknown-unknown is the target.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo + wasm target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/wasm/target
          key: ${{ runner.os }}-wasm-${{ hashFiles('engine/wasm/Cargo.toml', 'engine/core/Cargo.toml', 'engine/wasm/src/**', 'engine/core/src/**') }}
          restore-keys: ${{ runner.os }}-wasm-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site (wasm + launcher stage + docs + playground)
        run: bun run site:build

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy -c site/wrangler.jsonc

  # pocket.nexus is static files with no build step, so it deploys on its own
  # and finishes before the PocketJS build does.
  nexus:
    name: pocket.nexus
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy -c site/nexus/wrangler.jsonc

  # 3d.pocket.nexus is static files with no build step as well.
  pocket3d:
    name: 3d.pocket.nexus
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy -c site/pocket3d/wrangler.jsonc

  # microts.pocket.nexus: the MicroTS docs and playground. The playground kit
  # bundles hosts/web/pocketjs.wasm, so this job builds it like the PocketJS
  # job does; the build also fetches the pinned pocket-retro commit.
  microts:
    name: microts.pocket.nexus
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo + wasm target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/wasm/target
          key: ${{ runner.os }}-wasm-${{ hashFiles('engine/wasm/Cargo.toml', 'engine/core/Cargo.toml', 'engine/wasm/src/**', 'engine/core/src/**') }}
          restore-keys: ${{ runner.os }}-wasm-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run microts:typecheck

      - name: Build site (wasm + preview kit + retro games + SPA)
        run: bun run microts:build

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy -c site/microts/wrangler.jsonc
