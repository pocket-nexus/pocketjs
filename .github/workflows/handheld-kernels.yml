name: Handheld device kernels
on:
  pull_request:
    paths: ['devices/psp/**', 'hosts/psp/**', 'tests/psp-toolchain.test.ts', '.github/workflows/handheld-kernels.yml']
  push:
    branches: [main]
    paths: ['devices/psp/**', 'hosts/psp/**', 'tests/psp-toolchain.test.ts', '.github/workflows/handheld-kernels.yml']
permissions:
  contents: read
jobs:
  ge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: cargo test --locked --manifest-path devices/psp/pocket-psp-ge/Cargo.toml
      - run: bun test tests/psp-toolchain.test.ts
