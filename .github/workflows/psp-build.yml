name: PSP build

# Installs the PSP toolchain the framework pins with `pocket target add psp`
# into an empty cache, checks that a second add downloads nothing, and builds
# the hero EBOOT through `pocket +psp build`. The target C compiler and archiver
# are `false`: QuickJS arrives as a prebuilt archive. The generated guest uses
# its explicit LLVM compiler and the pinned SDK headers.

on:
  pull_request:
    paths:
      - ".github/workflows/psp-build.yml"
      - "tools/targets/**"
      - "tools/psp.ts"
      - "tools/psp-linker.ts"
      - "engine/guest-quickjs/**"
      - "engine/runtime/**"
      - "engine/runtime-cabi/**"
      - "tools/pocket.ts"
      - "tools/cli/**"
      - "programs/psp/**"
      - "devices/psp/**"
      - "engine/core/**"
      - "engine/spec/**"
      - "engine/drivers/**"
      - "engine/raster/**"
      - "engine/present/**"
      - "engine/package/**"
      - "engine/modules/media/**"
      - "engine/render/draw-ops/**"
      - "engine/render/glyph-pages/**"
      - "package.json"
      - "bun.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/psp-build.yml"
      - "tools/targets/**"
      - "tools/psp.ts"
      - "tools/psp-linker.ts"
      - "engine/guest-quickjs/**"
      - "engine/runtime/**"
      - "engine/runtime-cabi/**"
      - "tools/pocket.ts"
      - "tools/cli/**"
      - "programs/psp/**"
      - "devices/psp/**"
      - "engine/core/**"
      - "engine/spec/**"
      - "engine/drivers/**"
      - "engine/raster/**"
      - "engine/present/**"
      - "engine/package/**"
      - "engine/modules/media/**"
      - "engine/render/draw-ops/**"
      - "engine/render/glyph-pages/**"
      - "package.json"
      - "bun.lock"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: psp-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eboot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: LLVM for the generated PSP guest (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm
          echo "POCKETJS_LLVM_BIN=/usr/bin" >> "$GITHUB_ENV"
      - name: LLVM for the generated PSP guest (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "POCKETJS_LLVM_BIN=$(brew --prefix llvm)/bin" >> "$GITHUB_ENV"
      - name: Empty cache
        run: echo "POCKET_NEXUS_CACHE_DIR=$RUNNER_TEMP/pocket-nexus" >> "$GITHUB_ENV"
      - name: pocket target add psp
        run: bun tools/cli/bin.mjs target add psp
      - name: A second add downloads nothing
        run: |
          bun tools/cli/bin.mjs target add psp | tee second-add.log
          ! grep -q downloading second-add.log
      - name: pocket +psp build
        env:
          TARGET_CC: /usr/bin/false
          TARGET_AR: /usr/bin/false
          CC_mipsel_sony_psp: /usr/bin/false
          AR_mipsel_sony_psp: /usr/bin/false
        run: bun tools/cli/bin.mjs +psp build --manifest apps/hero/pocket.json --project-root . -- --release
      - run: test -s programs/psp/target/mipsel-sony-psp/release/EBOOT.PBP
