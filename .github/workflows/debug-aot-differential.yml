name: debug aot-differential (temporary)
on:
  push:
    branches: ["debug/aot-differential-linux"]
permissions:
  contents: read
jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: bun install --frozen-lockfile
      - run: bun tools/wasm.ts
      - run: bun tools/build.ts solid-aot-lab-main --no-config
      - name: standalone
        continue-on-error: true
        run: bun test --conditions=browser tests/aot-differential.test.ts
      - name: stage
        continue-on-error: true
        run: bun tools/test.ts --stage="AOT frontends" 2>&1 | grep -E "\((pass|fail)\) Solid and Rust|^ *[0-9]+ fail"
      - name: pairwise
        continue-on-error: true
        run: |
          for f in aot-types aot-solid-frontend aot-vue-frontend solid-for solid-aot-lab vue-vapor-frame-flush aot-admission aot-solid-browser aot-constant-contracts aot-codegen; do
            echo "== $f"; bun test --conditions=browser tests/$f.test.ts tests/aot-differential.test.ts 2>&1 | grep -E "\((pass|fail)\) Solid and Rust|group\]tests" || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aot-differential
          path: |
            .pocket-build/validation/solid-aot/differential/
            !.pocket-build/validation/solid-aot/differential/target/
