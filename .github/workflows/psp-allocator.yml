name: PSP allocator contracts

on:
  pull_request:
    paths:
      - ".github/workflows/psp-allocator.yml"
      - "programs/psp/**"
      - "tools/psp-prx.ts"
      - "tests/psp-prx.test.ts"
      - "tests/fixtures/psp-prx/**"
      - "tests/psp-arena.test.ts"
      - "tests/psp-qjs-allocator.test.ts"
      - "tests/helpers/psp-allocator-harness.ts"
      - "tests/fixtures/psp-allocator/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/psp-allocator.yml"
      - "programs/psp/**"
      - "tools/psp-prx.ts"
      - "tests/psp-prx.test.ts"
      - "tests/fixtures/psp-prx/**"
      - "tests/psp-arena.test.ts"
      - "tests/psp-qjs-allocator.test.ts"
      - "tests/helpers/psp-allocator-harness.ts"
      - "tests/fixtures/psp-allocator/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  allocator:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Read fixed Rust toolchain
        id: rust-pin
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
      - run: bun test tests/psp-arena.test.ts tests/psp-qjs-allocator.test.ts tests/psp-prx.test.ts
