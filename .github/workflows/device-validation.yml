name: Device validation mechanisms
on:
  pull_request:
    paths: ['.bun-version', ".github/workflows/device-validation.yml", "tools/device-*.ts", "tools/vita-dev.ts", "tools/3ds-dev.ts", "tools/psplink.ts", "tools/psplink-cache.ts", "tests/psplink-cache.test.ts", "tests/device-*.test.ts", "tests/fixtures/device-lease-child.ts", "tools/test.ts"]
  push:
    branches: [main]
    paths: ['.bun-version', ".github/workflows/device-validation.yml", "tools/device-*.ts", "tools/vita-dev.ts", "tools/3ds-dev.ts", "tools/psplink.ts", "tools/psplink-cache.ts", "tests/psplink-cache.test.ts", "tests/device-*.test.ts", "tests/fixtures/device-lease-child.ts", "tools/test.ts"]
permissions:
  contents: read
jobs:
  host:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun test tests/device-lease.test.ts tests/device-evidence.test.ts tests/psplink-cache.test.ts
