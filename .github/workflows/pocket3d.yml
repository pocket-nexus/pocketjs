name: Pocket3D

on:
  pull_request:
    paths:
      - '.github/workflows/pocket3d.yml'
      - 'engine/pocket3d/crates/pocket3d/**'
      - 'engine/pocket3d/crates/pocket3d-anim/**'
      - 'engine/pocket3d/crates/pocket3d-mesh/**'
      - 'engine/pocket3d/crates/pocket3d-world/**'
      - 'engine/Cargo.toml'
      - 'engine/Cargo.lock'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pocket3d.yml'
      - 'engine/pocket3d/crates/pocket3d/**'
      - 'engine/pocket3d/crates/pocket3d-anim/**'
      - 'engine/pocket3d/crates/pocket3d-mesh/**'
      - 'engine/pocket3d/crates/pocket3d-world/**'
      - 'engine/Cargo.toml'
      - 'engine/Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: pocket3d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo fmt --manifest-path engine/Cargo.toml -p pocket3d-world -p pocket3d -- --check
      - run: cargo test --locked --manifest-path engine/Cargo.toml -p pocket3d-world -p pocket3d --lib
      - run: cargo check --locked --manifest-path engine/Cargo.toml -p pocket-widget -p pocket-vrm -p pocket-ui-wgpu
      - run: cargo clippy --locked --manifest-path engine/Cargo.toml -p pocket3d-world -p pocket3d --all-targets -- -D warnings
