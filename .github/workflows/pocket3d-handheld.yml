name: Pocket3D handheld
on:
  pull_request:
    paths: ['engine/pocket3d/crates/pocket3d-anim/**', 'engine/pocket3d/crates/pocket3d-mesh/**', 'engine/pocket3d/crates/pocket3d/**', 'engine/pocket3d/backends/citro3d/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/pocket3d-handheld.yml']
  push:
    branches: [main]
    paths: ['engine/pocket3d/crates/pocket3d-anim/**', 'engine/pocket3d/crates/pocket3d-mesh/**', 'engine/pocket3d/crates/pocket3d/**', 'engine/pocket3d/backends/citro3d/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/pocket3d-handheld.yml']
permissions:
  contents: read
concurrency:
  group: pocket3d-handheld-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Read fixed Rust toolchain
        id: rust-pin
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Shared animation and mesh contracts
        run: cargo test --locked --manifest-path Cargo.toml -p pocket3d-anim -p pocket3d-mesh --lib
      - name: Format portable crates
        run: cargo fmt --manifest-path Cargo.toml -p pocket3d-anim -p pocket3d-mesh -- --check
      - name: Lint portable crates
        run: cargo clippy --locked --manifest-path Cargo.toml -p pocket3d-anim -p pocket3d-mesh --all-targets -- -D warnings
      - name: Build independent PICA fixture
        run: >-
          docker run --rm -v "$PWD:/repo"
          -w /repo/engine/pocket3d/backends/citro3d/example
          devkitpro/devkitarm@sha256:116afba8df8453961de2936ffab20dd441edf4d682856c1ec8b0e53d7ed0bbf5
          make -j4 CAPTURE=1
      - uses: actions/upload-artifact@v7
        with:
          name: pocket3d-rigid-fixture
          path: dist/pocket3d-citro3d/rigid-skin.3dsx
          if-no-files-found: error
