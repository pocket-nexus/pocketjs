name: PocketJS UI overlay

on:
  pull_request:
    paths:
      - '.github/workflows/pocket-ui-overlay.yml'
      - 'framework/src/desktop-pointer.ts'
      - 'framework/src/overlay-host.ts'
      - 'framework/src/themes/**'
      - 'framework/compiler/subpaths.ts'
      - 'tests/desktop-pointer.test.ts'
      - 'engine/crates/pocket-ui-wgpu/**'
      - 'devices/web/pocket-web-render/**'
      - 'engine/runtime/**'
      - 'engine/guest-rquickjs/**'
      - 'engine/core/**'
      - 'engine/spec/**'
      - 'engine/drivers/**'
      - 'engine/raster/**'
      - 'engine/present/**'
      - 'engine/package/**'
      - 'engine/modules/media/**'
      - 'engine/render/draw-ops/**'
      - 'engine/render/glyph-pages/**'
      - 'engine/crates/pocket-ui-surface/**'
      - 'engine/pocket3d/crates/pocket3d/src/app.rs'
      - 'engine/pocket3d/crates/pocket3d/src/input.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: pocket-ui-overlay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test tests/desktop-pointer.test.ts
      - run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
      - name: Read fixed Rust toolchain
        id: rust-pin
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - run: cargo fmt --manifest-path Cargo.toml -p pocket3d -p pocket-ui-wgpu -- --check
      - run: cargo test --locked --manifest-path Cargo.toml -p pocket3d -p pocket-ui-wgpu --lib
      - run: cargo clippy --locked --manifest-path Cargo.toml -p pocket3d -p pocket-ui-wgpu --all-targets -- -D warnings
      - run: cargo fmt --manifest-path Cargo.toml -p pocket-web-render -- --check
      - run: cargo test --locked --manifest-path Cargo.toml -p pocket-web-render
      - run: cargo clippy --locked --manifest-path Cargo.toml -p pocket-web-render --all-targets -- -D warnings
