name: Model AOT semantics
on:
  pull_request:
    paths:
      - 'microts/compiler/**'
      - 'framework/**'
      - 'engine/core/**'
      - 'engine/spec/**'
      - 'engine/drivers/**'
      - 'engine/raster/**'
      - 'engine/present/**'
      - 'engine/package/**'
      - 'engine/modules/media/**'
      - 'engine/render/draw-ops/**'
      - 'engine/render/glyph-pages/**'
      - 'engine/crates/microts/**'
      - 'engine/crates/pocket-ui-surface/**'
      - 'programs/web/wasm/**'
      - 'programs/native/cabi/**'
      - 'engine/runtime/**'
      - 'engine/runtime-cabi/**'
      - 'engine/guest-quickjs/**'
      - 'engine/guest-rquickjs/**'
      - 'programs/native/quickjs/**'
      - 'programs/web/**'
      - 'platforms/web/**'
      - 'apps/solid-aot-lab/**'
      - 'contracts/**'
      - 'tests/aot-*.test.ts'
      - 'tests/fixtures/aot-model/**'
      - 'tools/build.ts'
      - 'tools/test.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/model-aot.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: model-aot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  semantics:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Read fixed Rust toolchain
        id: rust-pin
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
          components: rustfmt
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun tools/test.ts --stage="Model AOT"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: model-aot-reproduction
          path: |
            .pocket-build/validation/model-aot/
            tests/fixtures/aot-model/found/
