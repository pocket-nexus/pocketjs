name: Linux portable renderer

on:
  pull_request:
    paths:
      - ".github/workflows/desktop-linux.yml"
      - "contracts/spec/**"
      - "engine/core/**"
      - "engine/spec/**"
      - "engine/drivers/**"
      - "engine/raster/**"
      - "engine/present/**"
      - "engine/package/**"
      - "engine/modules/media/**"
      - "engine/render/draw-ops/**"
      - "engine/render/glyph-pages/**"
      - "engine/crates/pocket-mod/**"
      - "engine/crates/pocket-ui-surface/**"
      - "engine/crates/pocket-text/**"
      - "framework/src/text-layout.ts"
      - "framework/src/offload.ts"
      - "hosts/web/*offload*.js"
      - "hosts/web/text-*"
      - "tools/*offload*"
      - "tools/companion-session.ts"
      - "tests/offload-provider.test.ts"
      - "tests/companion-session.test.ts"
      - "tests/fixtures/offload-ready-worker.ts"
      - "tools/text-*"
      - "tests/text-layout-client.test.ts"
      - "apps/text-offload/**"
      - "hosts/desktop/**"
      - "engine/crates/pocket-ui-wgpu/**"
      - "devices/web/pocket-web-render/**"
      - "engine/runtime/**"
      - "engine/guest-rquickjs/**"
      - "engine/pocket3d/crates/pocket3d/**"
      - "hosts/web/app-instance.*"
      - "hosts/web/system-engine.js"
      - "hosts/web/wasm-ops.js"
      - "framework/src/manifest/**"
      - "tests/platform-contracts.test.ts"
      - "tests/pocket-system.test.ts"
      - "tests/web-system-host.test.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/desktop-linux.yml"
      - "contracts/spec/**"
      - "engine/core/**"
      - "engine/spec/**"
      - "engine/drivers/**"
      - "engine/raster/**"
      - "engine/present/**"
      - "engine/package/**"
      - "engine/modules/media/**"
      - "engine/render/draw-ops/**"
      - "engine/render/glyph-pages/**"
      - "engine/crates/pocket-mod/**"
      - "engine/crates/pocket-ui-surface/**"
      - "engine/crates/pocket-text/**"
      - "framework/src/text-layout.ts"
      - "framework/src/offload.ts"
      - "hosts/web/*offload*.js"
      - "hosts/web/text-*"
      - "tools/*offload*"
      - "tools/companion-session.ts"
      - "tests/offload-provider.test.ts"
      - "tests/companion-session.test.ts"
      - "tests/fixtures/offload-ready-worker.ts"
      - "tools/text-*"
      - "tests/text-layout-client.test.ts"
      - "apps/text-offload/**"
      - "hosts/desktop/**"
      - "engine/crates/pocket-ui-wgpu/**"
      - "devices/web/pocket-web-render/**"
      - "engine/runtime/**"
      - "engine/guest-rquickjs/**"
      - "engine/pocket3d/crates/pocket3d/**"
      - "hosts/web/app-instance.*"
      - "hosts/web/system-engine.js"
      - "hosts/web/wasm-ops.js"
      - "framework/src/manifest/**"
      - "tests/platform-contracts.test.ts"
      - "tests/pocket-system.test.ts"
      - "tests/web-system-host.test.ts"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  linux:
    name: linux-app build + X11 smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install native window dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          clang cmake pkg-config libwayland-dev libx11-dev libx11-xcb-dev
          libxkbcommon-dev libxkbcommon-x11-dev libudev-dev libdrm-dev libgbm-dev
          libxcb-shape0-dev libxcb-xfixes0-dev xvfb xauth libvulkan1 mesa-vulkan-drivers
      - name: Read fixed Rust toolchain
        id: rust-pin
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Linux, web and System contract tests
        run: bun test tests/platform-contracts.test.ts tests/pocket-system.test.ts tests/web-system-host.test.ts tests/text-layout-client.test.ts tests/offload.test.ts tests/offload-provider.test.ts tests/companion-session.test.ts

      - name: Resolve and build the note for linux-app
        run: |
          bun -e '
          import { validateAndResolveBuildPlan } from "./framework/src/manifest/resolve.ts";
          import { mkdirSync } from "node:fs";
          const manifest = await Bun.file("apps/note/pocket.json").json();
          const result = validateAndResolveBuildPlan(manifest, { target: "linux-app" });
          if (!result.ok) throw new Error(JSON.stringify(result.diagnostics));
          mkdirSync(".pocket/linux-app", { recursive: true });
          await Bun.write(".pocket/linux-app/note-main.plan.json", JSON.stringify(result.plan, null, 2) + "\n");'
          bun tools/build.ts --plan=.pocket/linux-app/note-main.plan.json

      - name: Rust format, lint and tests
        run: |
          cargo fmt --check --manifest-path Cargo.toml -p pocket-desktop-host
          cargo clippy --locked --manifest-path Cargo.toml -p pocket-desktop-host -- -D warnings
          cargo test --locked --manifest-path Cargo.toml -p pocket-desktop-host
          cargo test --locked --manifest-path Cargo.toml -p pocket-desktop-host -- --ignored
          cargo test --locked --manifest-path Cargo.toml -p pocket-text
          cargo test --locked --manifest-path Cargo.toml -p pocketjs-wasm
          bun tools/text-wasm.ts

      - name: Build linux-app release host
        run: cargo build --release --locked --manifest-path Cargo.toml -p pocket-desktop-host

      - name: Launch linux-app under X11
        env:
          POCKETJS_DIST: ${{ github.workspace }}/dist
        run: >-
          timeout 30s xvfb-run -a target/release/pocket-desktop-host
          --app note-main --title Note --viewport 720x480 --density 1
          --companions note --editor --file /tmp/pocket-note.md
          --quit-after 20
