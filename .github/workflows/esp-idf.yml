name: ESP-IDF components

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: >-
          bun test tests/idf-host-profile.test.ts tests/idf-embed.test.ts
          tests/pocket-package.test.ts tests/platform-contracts.test.ts
          tests/idf-incremental.test.ts tests/idf-release.test.ts tests/idf-package-corpus.test.ts
      - run: bun tools/esp-idf-contracts.ts --check
      - uses: dtolnay/rust-toolchain@1.93.0
      - run: cargo test --locked --manifest-path engine/Cargo.toml -p pocket-runtime-cabi -p pocket-present -p pocket-render-esp-ppa --features pocket-render-esp-ppa/cabi
      - run: cargo test --locked --manifest-path engine/Cargo.toml -p pocket-package -p pocket-media
      - name: Test C bindings with the pinned QuickJS component
        env:
          POCKETJS_QUICKJS_SOURCE: ${{ runner.temp }}/pocketjs-quickjs/quickjs-ng
        run: |
          bun -e 'const r = await fetch("https://components-file.espressif.com/components/espressif/quickjs-ng/0.14.0/espressif__quickjs-ng-v0.14.0.zip"); if (!r.ok) throw new Error(String(r.status)); await Bun.write(process.env.RUNNER_TEMP + "/quickjs.zip", r);'
          unzip -q "$RUNNER_TEMP/quickjs.zip" -d "$RUNNER_TEMP/pocketjs-quickjs"
          bun tools/esp-idf-host-tests.ts
      - uses: dtolnay/rust-toolchain@nightly
      - name: Fuzz canonical package admission and short reads
        run: |
          cargo install cargo-fuzz --locked
          mkdir -p .pocket-build/validation/package-fuzz/ci/corpus
          cp tests/fixtures/packages/corpus/* .pocket-build/validation/package-fuzz/ci/corpus/
          cd engine/package
          CARGO_TARGET_DIR=../../.pocket-build/validation/package-fuzz/target cargo +nightly fuzz run admission ../../.pocket-build/validation/package-fuzz/ci/corpus -- -runs=10000 -max_len=8192 -artifact_prefix=../../.pocket-build/validation/package-fuzz/ci/

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [esp32p4, esp32s3]
        idf: [release-v6.0, release-v6.1]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      - name: Install P4 Rust target
        if: matrix.target == 'esp32p4'
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: riscv32imafc-unknown-none-elf

      - name: Build P4 native archive
        if: matrix.target == 'esp32p4'
        run: bun tools/esp-idf-native.ts --target esp32p4

      - name: Install user-managed Xtensa Rust toolchain fixture
        if: matrix.target == 'esp32s3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/esp-rust-dist" "$RUNNER_TEMP/esp-rust"
          gh release download v1.97.0.0 -R esp-rs/rust-build \
            -p rust-1.97.0.0-x86_64-unknown-linux-gnu.tar.xz \
            -p rust-src-1.97.0.0.tar.xz -D "$RUNNER_TEMP/esp-rust-dist"
          tar -xf "$RUNNER_TEMP/esp-rust-dist/rust-1.97.0.0-x86_64-unknown-linux-gnu.tar.xz" \
            -C "$RUNNER_TEMP/esp-rust-dist"
          tar -xf "$RUNNER_TEMP/esp-rust-dist/rust-src-1.97.0.0.tar.xz" \
            -C "$RUNNER_TEMP/esp-rust-dist"
          "$RUNNER_TEMP/esp-rust-dist/rust-nightly-x86_64-unknown-linux-gnu/install.sh" \
            --prefix="$RUNNER_TEMP/esp-rust" --disable-ldconfig
          "$RUNNER_TEMP/esp-rust-dist/rust-src-nightly/install.sh" \
            --prefix="$RUNNER_TEMP/esp-rust" --disable-ldconfig

      - name: Build S3 native archive
        if: matrix.target == 'esp32s3'
        run: >-
          bun tools/esp-idf-native.ts --target esp32s3
          --cargo "$RUNNER_TEMP/esp-rust/bin/cargo"

      - name: Compile deterministic smoke package and export its program profile
        run: |
          bun tools/pocket.ts compile \
            --manifest hosts/esp-idf/examples/smoke/pocket.json \
            --runtime-config hosts/esp-idf/examples/smoke/pocket.runtime-config.ts \
            --project-root hosts/esp-idf/examples/smoke \
            --plan-dir "$GITHUB_WORKSPACE/.pocket-build/validation/idf-ci/plans" \
            --outdir "$GITHUB_WORKSPACE/.pocket-build/validation/idf-ci/app" \
            --output "$GITHUB_WORKSPACE/hosts/esp-idf/examples/smoke/idf-smoke.pocket"
          bun tools/pocket.ts profile export \
            --config hosts/esp-idf/examples/smoke/pocket.runtime-config.ts \
            --out "$GITHUB_WORKSPACE/.pocket-build/validation/idf-ci/profile"

      - name: Verify committed prebuilt package
        run: >-
          cmp hosts/esp-idf/examples/smoke/idf-smoke.pocket
          hosts/esp-idf/examples/prebuilt/idf-smoke.pocket

      - name: Build ESP-IDF smoke firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          path: hosts/esp-idf/examples/smoke
          # The action mounts the checkout at its own container path. Resolve
          # exported artifacts from this example's working directory.
          command: >-
            idf.py -DPOCKETJS_RUST_FROM_SOURCE=OFF
            -DPOCKETJS_PROFILE_EXPORT_DIR="$PWD/../../../../.pocket-build/validation/idf-ci/profile"
            build

      - name: Build offline prebuilt firmware
        if: matrix.idf == 'release-v6.0'
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          path: hosts/esp-idf/examples/prebuilt
          command: >-
            idf.py -DPOCKETJS_RUST_FROM_SOURCE=OFF
            -DPOCKETJS_PROFILE_EXPORT_DIR="$PWD/../../../../.pocket-build/validation/idf-ci/profile"
            build

      - name: Build optional runner firmware
        if: matrix.idf == 'release-v6.0'
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          path: hosts/esp-idf/examples/runner
          command: >-
            idf.py -DPOCKETJS_RUST_FROM_SOURCE=OFF
            -DPOCKETJS_PROFILE_EXPORT_DIR="$PWD/../../../../.pocket-build/validation/idf-ci/profile"
            build
