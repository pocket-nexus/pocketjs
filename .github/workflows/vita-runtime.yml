name: Vita runtime contracts

on:
  pull_request:
    paths: &paths
      - ".bun-version"
      - "tools/build/embedded-apps.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "platforms/vita/**"
      - "profiles/vita.ts"
      - "tools/build/**"
      - "tools/profile-export.ts"
      - "tools/profile-resolver.ts"
      - ".github/workflows/vita-runtime.yml"
      - "programs/vita/**"
      - "devices/vita/**"
      - "tools/vita*.ts"
      - "tools/vita-usb/**"
      - "tests/vita*.test.ts"
      - "tests/fixtures/vita-dev/**"
      - "tests/fixtures/vita-runtime/**"
      - "tools/test-vita-runtime.ts"
      - "tests/npm-package.test.ts"
      - "tools/png.ts"
      - "contracts/**"
      - "engine/core/**"
      - "engine/spec/**"
      - "engine/drivers/**"
      - "engine/raster/**"
      - "engine/present/**"
      - "engine/package/**"
      - "engine/modules/media/**"
      - "engine/render/draw-ops/**"
      - "engine/render/glyph-pages/**"
      - "engine/render/tex-cache/**"
      - "engine/render/tri-batch/**"
      - "engine/runtime/**"
      - "engine/runtime-cabi/**"
      - "engine/profile-build/**"
      - "engine/guest-quickjs/**"
      - "package.json"
      - "bun.lock"
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: vita-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Read fixed Rust toolchain
        id: rust-pin
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # Pure host tests: this validates protocol/package behavior, not Vita
      # hardware, GXM rendering, or kernel-driver loading.
      - run: bun test tests/vita-dev.test.ts tests/vita-runtime.test.ts tests/vita-package.test.ts tests/npm-package.test.ts
      - run: cargo test --locked --manifest-path Cargo.toml -p pocket-vita-gxm
      - run: cargo test --locked --manifest-path Cargo.toml -p pocket-vita-render
