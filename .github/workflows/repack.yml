name: Runtime repack

# The repack step (tools/repack/): a prebuilt PocketJS runtime and a game's
# .pocket into a device's installation package, in TypeScript with no native
# tool. These tests hold each target's package structure, its determinism and
# its refusals.
on:
  pull_request:
    paths:
      - ".github/workflows/repack.yml"
      - "tools/repack.ts"
      - "tools/repack/**"
      - "tools/runtime.ts"
      - "tools/runtime/**"
      - "tools/median-cut.ts"
      - "tools/png.ts"
      - "contracts/spec/pocket-package.ts"
      - "tests/repack-*.test.ts"
      - "tests/fixtures/packages/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/repack.yml"
      - "tools/repack.ts"
      - "tools/repack/**"
      - "tools/runtime.ts"
      - "tools/runtime/**"
      - "tools/median-cut.ts"
      - "tools/png.ts"
      - "contracts/spec/pocket-package.ts"
      - "tests/repack-*.test.ts"
      - "tests/fixtures/packages/**"

permissions:
  contents: read

jobs:
  repack:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test tests/repack-*.test.ts
