name: ESP32-P4 RGB565 backend

on:
  pull_request:
    paths:
      - ".github/workflows/esp32p4.yml"
      - "engine/core/**"
      - "engine/backends/rgb565/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/esp32p4.yml"
      - "engine/core/**"
      - "engine/backends/rgb565/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rust:
    name: Rust renderer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Test RGB565 core rasterizer
        run: cargo test --locked --manifest-path engine/core/Cargo.toml

      - name: Test ESP32-P4 DrawList backend
        run: cargo test --locked --manifest-path engine/backends/rgb565/Cargo.toml
