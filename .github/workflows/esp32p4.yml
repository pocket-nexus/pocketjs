name: ESP32-P4 RGB565 backend

on:
  pull_request:
    paths:
      - ".github/workflows/esp32p4.yml"
      - "engine/core/**"
      - "engine/spec/**"
      - "engine/drivers/**"
      - "engine/raster/**"
      - "engine/present/**"
      - "engine/package/**"
      - "engine/modules/media/**"
      - "engine/render/draw-ops/**"
      - "engine/render/glyph-pages/**"
      - "engine/render/tri-batch/**"
      - "engine/render/tex-cache/**"
      - "engine/backends/rgb565/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/esp32p4.yml"
      - "engine/core/**"
      - "engine/spec/**"
      - "engine/drivers/**"
      - "engine/raster/**"
      - "engine/present/**"
      - "engine/package/**"
      - "engine/modules/media/**"
      - "engine/render/draw-ops/**"
      - "engine/render/glyph-pages/**"
      - "engine/render/tri-batch/**"
      - "engine/render/tex-cache/**"
      - "engine/backends/rgb565/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rust:
    name: Rust renderer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Test UI core
        run: cargo test --locked --manifest-path engine/core/Cargo.toml

      - name: Test extracted subsystems and rendering tools
        run: cargo test --locked --manifest-path engine/Cargo.toml -p pocket-raster -p pocket-present -p pocket-package -p pocket-media -p pocket-draw-ops -p pocket-glyph-pages -p pocket-tri-batch -p pocket-tex-cache

      - name: Test retained layout against a fresh solver
        run: cargo test --locked --manifest-path engine/core/Cargo.toml --features counters

      - name: Test ESP32-P4 DrawList backend
        run: cargo test --locked --manifest-path engine/backends/rgb565/Cargo.toml
