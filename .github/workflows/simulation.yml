name: Simulation and companion
on:
  pull_request:
    paths: ['engine/crates/pocket-sim/**', 'Cargo.toml', 'Cargo.lock', 'tools/companion-session.ts', 'tools/offload-*.ts', 'tests/companion-session.test.ts', 'tests/offload.test.ts', 'programs/3ds/product/src/offload*', '.github/workflows/simulation.yml']
  push:
    branches: [main]
    paths: ['engine/crates/pocket-sim/**', 'Cargo.toml', 'Cargo.lock', 'tools/companion-session.ts', 'tools/offload-*.ts', 'tests/companion-session.test.ts', 'tests/offload.test.ts', 'programs/3ds/product/src/offload*', '.github/workflows/simulation.yml']
permissions:
  contents: read
concurrency:
  group: simulation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Read fixed Rust toolchain
        id: rust-pin
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: cargo test --locked --manifest-path Cargo.toml -p pocket-sim
      - run: cargo fmt --manifest-path Cargo.toml -p pocket-sim -- --check
      - run: cargo clippy --locked --manifest-path Cargo.toml -p pocket-sim --all-targets -- -D warnings
      - run: bun test tests/companion-session.test.ts tests/offload.test.ts
