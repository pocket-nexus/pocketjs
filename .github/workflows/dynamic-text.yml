name: Dynamic text coverage

on:
  pull_request:
    paths:
      - ".bun-version"
      - '.github/workflows/dynamic-text.yml'
      - 'framework/compiler/**'
      - 'framework/src/pak.ts'
      - 'framework/src/fonts.ts'
      - 'framework/src/primitives.ts'
      - 'framework/src/host.ts'
      - 'framework/src/resource.ts'
      - 'framework/src/resource-boundary.ts'
      - 'tools/font-archive-provider.ts'
      - 'tools/text-lab-*.ts'
      - 'tests/text-batch.test.ts'
      - 'framework/src/offload.ts'
      - 'contracts/spec/font-archive.ts'
      - 'platforms/psp/io/src/local.rs'
      - 'programs/psp/src/service_bindings.rs'
      - 'platforms/web/wasm-ops.js'
      - 'tests/helpers/font-archive-provider.ts'
      - 'tools/font-archive.ts'
      - 'tools/text-lab-assets.ts'
      - 'framework/src/bytes.ts'
      - 'engine/core/**'
      - 'engine/spec/**'
      - 'engine/drivers/**'
      - 'engine/raster/**'
      - 'engine/present/**'
      - 'engine/package/**'
      - 'engine/modules/media/**'
      - 'engine/render/draw-ops/**'
      - 'engine/render/glyph-pages/**'
      - 'programs/web/wasm/**'
      - 'programs/psp/src/scene.rs'
      - 'apps/text-cjk/**'
      - 'assets/fonts/**'
      - 'tests/font-config.test.ts'
      - 'tests/font-archive.test.ts'
      - 'tests/text-cjk.test.ts'
      - 'tests/renderer.test.ts'
      - 'tools/build.ts'
      - 'tools/test.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  text:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Read fixed Rust toolchain
        id: rust-pin
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - run: cargo test --locked --manifest-path Cargo.toml -p pocketjs-core
      - run: bun tools/wasm.ts
      - run: bun test tests/font-bake.test.ts tests/font-config.test.ts tests/font-archive.test.ts tests/text-batch.test.ts tests/text-cjk.test.ts
      - run: bun test --conditions=browser tests/renderer.test.ts
