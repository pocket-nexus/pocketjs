name: macOS portable renderer

# Native GPU and WASM software rendering share the Rust DrawList core. Text executes in
# bounded worker adapters; neither host depends on the legacy gpui backend.

on:
  pull_request:
    paths:
      - ".github/workflows/macos.yml"
      - "contracts/spec/**"
      - "contracts/schema/**"
      - "engine/core/**"
      - "engine/crates/pocket-ui-surface/**"
      - "engine/crates/pocket-text/**"
      - "framework/src/text-layout.ts"
      - "framework/src/offload.ts"
      - "hosts/web/*offload*.js"
      - "hosts/web/text-*"
      - "tools/*offload*"
      - "tools/companion-session.ts"
      - "tests/offload-provider.test.ts"
      - "tests/companion-session.test.ts"
      - "tests/fixtures/offload-ready-worker.ts"
      - "tools/text-*"
      - "tests/text-layout-client.test.ts"
      - "apps/text-offload/**"
      - "engine/wasm/**"
      - "hosts/desktop/**"
      - "engine/crates/pocket-ui-wgpu/**"
      - "engine/pocket3d/crates/pocket3d/**"
      - "tools/macos.ts"
      - "framework/src/components*.ts*"
      - "framework/src/host.ts"
      - "framework/src/native-tree.ts"
      - "framework/src/primitives.ts"
      - "framework/src/manifest/**"
      - "hosts/web/wasm-ops.js"
      - "hosts/web/app-instance.*"
      - "hosts/web/system-engine.js"
      - "apps/note/**"
      - "framework/compiler/**"
      - "assets/fonts/**"
      - "tests/platform-contracts.test.ts"
      - "tests/note.test.ts"
      - "tests/pocket-system.test.ts"
      - "tests/web-system-host.test.ts"
      - "tests/font-bake.test.ts"
      - "tests/npm-package.test.ts"
      - "package.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/macos.yml"
      - "contracts/spec/**"
      - "contracts/schema/**"
      - "engine/core/**"
      - "engine/crates/pocket-ui-surface/**"
      - "engine/crates/pocket-text/**"
      - "framework/src/text-layout.ts"
      - "framework/src/offload.ts"
      - "hosts/web/*offload*.js"
      - "hosts/web/text-*"
      - "tools/*offload*"
      - "tools/companion-session.ts"
      - "tests/offload-provider.test.ts"
      - "tests/companion-session.test.ts"
      - "tests/fixtures/offload-ready-worker.ts"
      - "tools/text-*"
      - "tests/text-layout-client.test.ts"
      - "apps/text-offload/**"
      - "engine/wasm/**"
      - "hosts/desktop/**"
      - "engine/crates/pocket-ui-wgpu/**"
      - "engine/pocket3d/crates/pocket3d/**"
      - "tools/macos.ts"
      - "framework/src/components*.ts*"
      - "framework/src/host.ts"
      - "framework/src/native-tree.ts"
      - "framework/src/primitives.ts"
      - "framework/src/manifest/**"
      - "hosts/web/wasm-ops.js"
      - "hosts/web/app-instance.*"
      - "hosts/web/system-engine.js"
      - "apps/note/**"
      - "framework/compiler/**"
      - "assets/fonts/**"
      - "tests/platform-contracts.test.ts"
      - "tests/note.test.ts"
      - "tests/pocket-system.test.ts"
      - "tests/web-system-host.test.ts"
      - "tests/font-bake.test.ts"
      - "tests/npm-package.test.ts"
      - "package.json"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rust:
    name: portable renderer + text worker + host
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          # note.test.ts boots the sim host, which builds the wasm core.
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine/crates/pocket-text
            hosts/desktop
            engine/wasm

      - uses: oven-sh/setup-bun@v2

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Contract + System + note + platform + npm package tests
        run: bun test tests/platform-contracts.test.ts tests/pocket-system.test.ts tests/web-system-host.test.ts tests/text-layout-client.test.ts tests/offload.test.ts tests/offload-provider.test.ts tests/companion-session.test.ts tests/note.test.ts tests/font-bake.test.ts tests/npm-package.test.ts && bun tests/contract.ts

      - name: Compile the note against macos-app (plan + bundle + pak)
        run: |
          bun -e '
          import { validateAndResolveBuildPlan } from "./framework/src/manifest/resolve.ts";
          import { mkdirSync } from "node:fs";
          const m = await Bun.file("apps/note/pocket.json").json();
          const r = validateAndResolveBuildPlan(m, { target: "macos-app" });
          if (!r.ok) throw new Error(JSON.stringify(r.diagnostics));
          mkdirSync(".pocket/macos-app", { recursive: true });
          await Bun.write(".pocket/macos-app/note-main.plan.json", JSON.stringify(r.plan, null, 2) + "\n");'
          bun tools/build.ts --plan=.pocket/macos-app/note-main.plan.json

      - name: Test core (TEXT_RUN + native measure gates)
        run: cargo test --locked --manifest-path engine/core/Cargo.toml

      - name: Test ui surface (svcOpen deny-by-default, string ops)
        run: cargo test --locked --manifest-path engine/Cargo.toml -p pocket-ui-surface

      - name: rustfmt
        run: |
          cargo fmt --check --manifest-path engine/crates/pocket-text/Cargo.toml
          cargo fmt --check --manifest-path hosts/desktop/Cargo.toml

      - name: Portable text and WASM tests
        run: |
          cargo test --locked --manifest-path engine/crates/pocket-text/Cargo.toml
          cargo test --locked --manifest-path engine/wasm/Cargo.toml
          bun tools/text-wasm.ts

      - name: Clippy native desktop host
        run: cargo clippy --locked --manifest-path hosts/desktop/Cargo.toml -- -D warnings

      - name: Test Metal DrawList rendering and frame leases
        run: |
          cargo test --locked --manifest-path engine/Cargo.toml -p pocket-ui-wgpu
          cargo test --locked --manifest-path hosts/desktop/Cargo.toml -- --include-ignored

      - name: Build macos-app host
        run: cargo build --locked --manifest-path hosts/desktop/Cargo.toml
