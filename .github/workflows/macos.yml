name: macOS portable renderer

# Exercise Metal rendering for the shared UI renderer used by widgets and Pocket3D.

on:
  pull_request:
    paths: &paths
      - ".bun-version"
      - ".github/workflows/macos.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "engine/core/**"
      - "engine/spec/**"
      - "engine/drivers/**"
      - "engine/raster/**"
      - "engine/package/**"
      - "engine/modules/media/**"
      - "engine/render/Cargo.toml"
      - "engine/render/src/**"
      - "engine/ui-surface/**"
      - "engine/text/**"
      - "engine/ui-wgpu/**"
      - "engine/runtime/**"
      - "engine/guest-rquickjs/**"
      - "engine/pocket3d/crates/pocket3d/**"
      - "devices/wgpu/pocket-wgpu-render/**"
      - "framework/src/manifest/**"
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Metal renderer
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Read fixed Rust toolchain
        id: rust-pin
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Test Metal DrawList rendering
        run: cargo test --locked --manifest-path Cargo.toml -p pocket-ui-wgpu -p pocket-wgpu-render -- --include-ignored
