name: macOS portable renderer

# What only a macOS machine runs: the Metal DrawList backend, the desktop
# host's GPU acceptance tests and its macOS lint, the note compiled against
# the macos-app profile, and the macos-app host build. Portable crates and
# the JavaScript contracts run in test.yml.

on:
  pull_request:
    paths: &paths
      - ".bun-version"
      - ".github/workflows/macos.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "engine/core/**"
      - "engine/spec/**"
      - "engine/drivers/**"
      - "engine/raster/**"
      - "engine/present/**"
      - "engine/package/**"
      - "engine/modules/media/**"
      - "engine/render/draw-ops/**"
      - "engine/render/glyph-pages/**"
      - "engine/crates/pocket-ui-surface/**"
      - "engine/crates/pocket-text/**"
      - "engine/crates/pocket-ui-wgpu/**"
      - "engine/runtime/**"
      - "engine/guest-rquickjs/**"
      - "engine/pocket3d/crates/pocket3d/**"
      - "programs/desktop/**"
      - "devices/web/pocket-web-render/**"
      - "tools/macos.ts"
      - "framework/src/manifest/**"
      - "framework/compiler/**"
      - "apps/note/**"
      - "hosts/macos-app/**"
      - "tools/build.ts"
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Metal renderer + macos-app host
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Read fixed Rust toolchain
        id: rust-pin
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Compile the note against macos-app (plan + bundle + pak)
        run: |
          bun -e '
          import { validateAndResolveBuildPlan } from "./framework/src/manifest/resolve.ts";
          import { readPocketManifest } from "./framework/src/manifest/load.ts";
          import { mkdirSync } from "node:fs";
          const { manifest: m } = readPocketManifest("apps/note/pocket.app.json");
          const r = validateAndResolveBuildPlan(m, { target: "macos-app" });
          if (!r.ok) throw new Error(JSON.stringify(r.diagnostics));
          mkdirSync(".pocket/macos-app", { recursive: true });
          await Bun.write(".pocket/macos-app/note-main.plan.json", JSON.stringify(r.plan, null, 2) + "\n");'
          bun tools/build.ts --plan=.pocket/macos-app/note-main.plan.json

      - name: Clippy native desktop host
        run: cargo clippy --locked --manifest-path Cargo.toml -p pocket-desktop-host --no-deps -- -D warnings

      - name: Test Metal DrawList rendering and frame leases
        run: |
          cargo test --locked --manifest-path Cargo.toml -p pocket-ui-wgpu
          cargo test --locked --manifest-path Cargo.toml -p pocket-desktop-host -- --include-ignored

      - name: Build macos-app host
        run: cargo build --locked --manifest-path Cargo.toml -p pocket-desktop-host
