permissions:
  contents: read

jobs:
  harness:
    name: C runtime + allocator (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: llvm-tools-preview
      - run: bun install --frozen-lockfile
      - name: Install the UI C ABI's pinned nightly
        run: |
          toolchain=$(bun -e 'console.log(Bun.TOML.parse(await Bun.file("engine/ui-cabi/rust-toolchain.toml").text()).toolchain.channel)')
          rustup toolchain install "$toolchain" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine/ui-cabi
      - name: Build renderer test styles
        run: bun tools/build.ts hero
      - name: Renderer and runtime stage/dispatcher contracts
        run: bun test --conditions=browser tests/quickjs-c-harness.test.ts tests/ui-bindings.test.ts tests/runtime-cabi.test.ts tests/runtime-cabi-compat.test.ts tests/sdk.test.ts tests/sdk-idf.test.ts tests/out-of-tree-rust.test.ts tests/renderer.test.ts tests/virtual-list.test.ts tests/vue-vapor-dom.test.ts
      - name: Native contacts, package corpus and device installation contracts
        run: bun test tests/contact-latch.test.ts tests/idf-package-corpus.test.ts tests/ipodtouch4-installation.test.ts tests/ipodtouch4-profile.test.ts tests/ipodtouch4-resources.test.ts tests/repack-ipod.test.ts
      - name: Build Clear simulator inputs
        run: bun tools/wasm.ts && bun tools/build.ts clear-main --framework=vue-vapor
      - name: Clear input and text chain
        run: bun test --conditions=browser tests/clear-text.test.ts tests/clear-ime-loading.test.ts
      - name: UI singleton access and alignment policy
        run: cargo test --locked --manifest-path engine/Cargo.toml -p pocket-runtime-cabi --features legacy-ui,harness-access
      - name: GLES1 vertex layout and ordered batches
        run: cargo test --locked --manifest-path engine/Cargo.toml -p pocket-runtime-cabi --features legacy-ui,gles1 gl::tests
      - name: Runtime scheduling and generated Rust guest
        run: cargo test --locked --manifest-path engine/Cargo.toml -p pocket-runtime -p pocket-guest-rquickjs
      - name: Generated C guest against QuickJS-NG
        run: bun tools/test-quickjs-guest.ts
      - name: Link and execute the C allocator and texture draw fixtures
        run: bun test tests/ui-cabi-allocator.test.ts tests/ui-cabi-psm-draw.test.ts
      - name: Test suite coverage and tape assertion contracts
        run: bun test tests/test-suite.test.ts tests/tape-assert.test.ts
      - name: Contract drift
        run: bun tests/contract.ts
      - name: Renderer goldens and deterministic replay
        if: runner.os == 'Linux'
        run: bun tests/golden.ts && bun run tape:check
