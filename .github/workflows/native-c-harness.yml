permissions:
  contents: read

jobs:
  harness:
    name: C runtime + allocator (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Install the workspace stable compiler
        run: |
          stable=$(bun -e 'console.log((await import("./tools/build/toolchains/rust.ts")).STABLE_RUST_TOOLCHAIN)')
          rustup toolchain install "$stable" --profile minimal --target wasm32-unknown-unknown --component llvm-tools-preview
      - run: bun install --frozen-lockfile
      - name: Install the UI C ABI's pinned nightly
        run: |
          toolchain=$(bun -e 'console.log((await import("./tools/build/toolchains/rust.ts")).BUILD_STD_NIGHTLY)')
          rustup toolchain install "$toolchain" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Build renderer test styles
        run: bun tools/build.ts hero
      - name: Renderer and runtime stage/dispatcher contracts
        run: bun test --conditions=browser tests/quickjs-c-harness.test.ts tests/native-program.test.ts tests/ui-bindings.test.ts tests/guest-web-bindings.test.ts tests/embedded-package.test.ts tests/nativescript-bridge.test.ts tests/runtime-cabi.test.ts tests/runtime-cabi-compat.test.ts tests/sdk.test.ts tests/sdk-idf.test.ts tests/out-of-tree-rust.test.ts tests/renderer.test.ts tests/virtual-list.test.ts tests/vue-vapor-dom.test.ts
      - name: Native contacts, package corpus and device installation contracts
        run: bun test tests/contact-latch.test.ts tests/idf-package-corpus.test.ts tests/ipodtouch4-installation.test.ts tests/ipodtouch4-profile.test.ts tests/ipodtouch4-resources.test.ts tests/repack-ipod.test.ts
      - name: Build Clear simulator inputs
        run: bun tools/wasm.ts && bun tools/build.ts clear-main --framework=vue-vapor
      - name: Clear input and text chain
        run: bun test --conditions=browser tests/clear-text.test.ts tests/clear-ime-loading.test.ts
      - name: UI singleton access and alignment policy
        run: cargo test --locked --manifest-path Cargo.toml -p pocket-runtime-cabi --features legacy-ui,harness-access
      - name: GLES1 vertex layout and ordered batches
        run: cargo test --locked --manifest-path Cargo.toml -p pocket-gles -p pocket-gles1 -p pocket-gles2
      - name: GE ownership and terminal completion
        run: bun test tests/ge-driver.test.ts
      - name: PSP generated guest composition
        run: bun test tests/psp-runtime.test.ts
      - name: Test GLES1 compatibility composition
        run: cargo test --locked --manifest-path Cargo.toml -p pocket-runtime-cabi --features legacy-ui,gles1 gl::tests
      - name: Test shared runtime, bindings and PPA renderer
        run: cargo test --locked --manifest-path Cargo.toml -p pocket-runtime -p pocket-guest-rquickjs -p pocket-ui-surface -p pocket-present -p pocket-package -p pocket-apple -p pocket-render-esp-ppa
      - name: AOT guest and compiled native presentation
        run: |
          cargo +stable test --locked --manifest-path Cargo.toml -p microts --features runtime
          cargo +stable test --locked --manifest-path programs/gba/Cargo.toml --lib
      - name: Generated C guest against QuickJS-NG
        run: bun tools/test-quickjs-guest.ts
      - name: Link and execute the C allocator and texture draw fixtures
        run: bun test tests/ui-cabi-allocator.test.ts tests/ui-cabi-psm-draw.test.ts
      - name: Test suite coverage and tape assertion contracts
        run: bun test tests/test-suite.test.ts tests/tape-assert.test.ts tests/e2e-build.test.ts
      - name: Contract drift
        run: bun tests/contract.ts
      - name: Renderer goldens and deterministic replay
        if: runner.os == 'Linux'
        run: bun tests/golden.ts && bun run tape:check
