[package]
name = "pocket-vita-runtime-contract"
version = "0.0.0"
edition = "2021"
publish = false
[workspace]
[features]
default = ["usb-debug"]
usb-debug = []
[dependencies]
pocket-spec = { path = "../../../engine/spec" }
libquickjs-sys = { git = "https://github.com/pocket-nexus/quickjs-rs.git", rev = "ba5bdd0dc013518768e76cd9e05cd30ed53dd35b" }
pocket-drivers = { path = "../../../engine/drivers" }
pocket-runtime = { path = "../../../engine/runtime" }
pocket-runtime-cabi = { path = "../../../engine/runtime-cabi" }
pocket-package = { path = "../../../engine/package" }
pocketjs-core = { path = "../../../engine/core" }
pocket-vita-render = { path = "../../../devices/vita/pocket-vita-render" }
serde_json = "1"
[build-dependencies]
cc = "1"
