# On-device conformance smoke for the data modules (pocket-db, pocket-fs)
# over a LittleFS partition — the hardware half of the verification story
# (the contract half lives in tests/{db,fs}.test.ts and the crates' own
# tests). Build with the local toolchain this directory pins, flash, and
# watch UART for "DATA-SMOKE: PASS". Power-cycle and run again: the boot
# counter proves persistence through real power loss.
[package]
name = "data-smoke"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "data-smoke"
harness = false

[workspace]

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1

[dependencies]
anyhow = "1"
log = "0.4"
serde_json = "1"
esp-idf-svc = { version = "0.52.1", features = ["critical-section"] }
# default-features = false: the firmware brings no QuickJS here — the smoke
# drives the module cores directly, exactly like a device host that has its
# own guest wiring.
pocket-db = { path = "../../../../engine/crates/pocket-db", default-features = false }
pocket-fs = { path = "../../../../engine/crates/pocket-fs", default-features = false }

[build-dependencies]
embuild = "0.33"

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "joltwallet/littlefs", version = "1.14.*" }
