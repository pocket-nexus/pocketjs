# UIKit composition over pocket-runtime-cabi with an owned or external guest.

[package]
name = "pocket-apple"
edition.workspace = true
description = "UIKit composition over the canonical PocketJS runtime and guest lifecycle"

version.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
pocket-spec = { workspace = true, default-features = true }
pocket-runtime-cabi = { workspace = true, default-features = true }
pocket-runtime = { workspace = true, default-features = true }
pocket-drivers = { workspace = true, default-features = true }
pocket-package = { workspace = true, default-features = true }
pocket-guest-rquickjs = { workspace = true, default-features = true }
serde_json = "1"
log = { workspace = true }

# rquickjs ships pre-generated FFI bindings for common targets but NOT the
# aarch64-apple-ios family, so generate them at build time (bindgen; requires
# libclang) for iOS builds only. Desktop builds — including the examples and
# `cargo test --workspace` in CI — keep the pre-generated bindings, so cargo's
# feature unification never drags libclang into the other workspace members.
[target.'cfg(target_os = "ios")'.dependencies]
rquickjs = { workspace = true, features = ["bindgen"] }
