# UIKit composition over pocket-runtime-cabi with an owned or external guest.

[package]
name = "pocket-apple"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "UIKit composition over the canonical PocketJS runtime and guest lifecycle"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
pocket-spec = { path = "../spec" }
pocket-runtime-cabi = { path = "../runtime-cabi" }
pocket-runtime = { path = "../runtime" }
pocket-drivers = { path = "../drivers" }
pocket-package = { path = "../package" }
pocket-guest-rquickjs = { path = "../guest-rquickjs" }
serde_json = "1"
log = { workspace = true }

# rquickjs ships pre-generated FFI bindings for common targets but NOT the
# aarch64-apple-ios family, so generate them at build time (bindgen; requires
# libclang) for iOS builds only. Desktop builds — including the examples and
# `cargo test --workspace` in CI — keep the pre-generated bindings, so cargo's
# feature unification never drags libclang into the other workspace members.
[target.'cfg(target_os = "ios")'.dependencies]
rquickjs = { workspace = true, features = ["bindgen"] }
