[package]
name = "pocket-runtime-cabi"
edition = "2021"

version.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PocketJS runtime cabi component"

[lib]
name = "pocket_runtime_cabi"
# Rust programs link this library into their own final artifact.
# SDK export selects --crate-type staticlib for the default C archive.
crate-type = ["rlib"]

[features]
default = ["std"]
std = []
# A no_std Rust program supplies its own allocator, panic and compiler handlers.
external-runtime = []

[dependencies]
pocketjs-core = { workspace = true, default-features = true }
pocket-runtime = { workspace = true, default-features = true }
pocket-drivers = { workspace = true, default-features = true }
pocket-raster = { workspace = true, default-features = true }
pocket-draw-ops = { workspace = true, default-features = true }
pocket-spec = { workspace = true, default-features = true }
pocket-glyph-pages = { workspace = true, default-features = true }
