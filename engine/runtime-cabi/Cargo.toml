[package]
name = "pocket-runtime-cabi"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "pocket_runtime_cabi"
crate-type = ["rlib", "staticlib"]

[features]
default = ["std"]
std = []
legacy-ui = ["dep:pocketjs-core", "dep:pocket-tri-batch", "dep:pocket-tex-cache"]
legacy-idf = ["dep:pocketjs-core", "dep:pocketjs-render-rgb565"]
standalone-extension-provider = []
gles1 = []
gl-frame-validation = []
software-only = []
harness-access = []
boot-stage = []

[dependencies]
pocketjs-core = { path = "../core", optional = true }
pocket-tri-batch = { path = "../render/tri-batch", optional = true }
pocket-tex-cache = { path = "../render/tex-cache", optional = true }
pocketjs-render-rgb565 = { path = "../backends/rgb565", optional = true }
pocket-runtime = { path = "../runtime" }
pocket-drivers = { path = "../drivers" }
pocket-raster = { path = "../raster" }
pocket-draw-ops = { path = "../render/draw-ops" }
pocket-spec = { path = "../spec" }
