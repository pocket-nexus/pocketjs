[package]
name = "microts"
edition.workspace = true
description = "MicroTS AOT models and views over the PocketJS retained UI"

version.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pocket-spec = { workspace = true, default-features = true }
pocketjs-core = { workspace = true }
ryu-js = { version = "1.0.3", default-features = false }
libm = "0.2"
pocket-runtime = { workspace = true, default-features = true, optional = true }
heapless = "0.8"

[target.'cfg(not(target_has_atomic = "32"))'.dependencies]
heapless = { version = "0.8", features = ["portable-atomic"] }
portable-atomic = { version = "1.3", default-features = false, features = ["require-cas"] }

[features]
default = []
# Share the canonical instance core and let Runtime own core ticks.
runtime = ["dep:pocket-runtime"]
# Layout work counters and the full-tree layout oracle (`Ui::layout_mismatches`).
counters = ["pocketjs-core/counters"]
model-trace = []
critical-section = ["portable-atomic/critical-section"]

[dev-dependencies]
pocket-drivers = { workspace = true, default-features = true }
