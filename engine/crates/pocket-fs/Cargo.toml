[package]
name = "pocket-fs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The fs module's reference core: a per-app file tree behind the contracts/spec/fs.ts boundary, mountable as globalThis.fs via pocket-mod"

[features]
# `mount` brings pocket-mod (and its QuickJS embedding) for the one-line
# globalThis.fs install. A device host with its own QuickJS wiring turns
# it off (`default-features = false`) and drives FsModule directly — the
# MCU build then never compiles an engine it doesn't use.
default = ["mount"]
mount = ["dep:pocket-mod", "dep:anyhow"]

[dependencies]
pocketjs-core = { workspace = true }
pocket-mod = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
serde_json = { workspace = true }
base64 = { workspace = true }
