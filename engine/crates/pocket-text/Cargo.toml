[package]
name = "pocket-text"
edition = "2021"
description = "Experimental portable worker-owned text layout for PocketJS io.offload"

version.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
pocketjs-core = { workspace = true, default-features = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std", "swash"] }
base64 = "0.22"
