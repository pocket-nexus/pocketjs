[package]
name = "pocket-widget"
edition.workspace = true
description = "Desktop widgets as a runtime-family capability: widget window shell with demand rendering, embedded `ui` surfaces on meshes, part picking, PSP input packing"

version.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pocket-spec = { workspace = true, default-features = true }
pocket-runtime = { workspace = true, default-features = true }
pocket-drivers = { workspace = true, default-features = true }
pocket-mod = { workspace = true, default-features = true }
pocket3d = { workspace = true, default-features = true }
pocket-ui-wgpu = { workspace = true, default-features = true }
pocketjs-core = { workspace = true, default-features = true }
wgpu = { workspace = true }
winit = { workspace = true }
glam = { workspace = true, features = ["std"] }
anyhow = { workspace = true }
log = { workspace = true }
