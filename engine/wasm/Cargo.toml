# Browser Runtime embedding and direct compiler/pixel harness, using plain
# WebAssembly exports and generated canonical guest bindings.
# Standalone cdylib; tools/wasm.ts builds wasm32-unknown-unknown.

[package]
name = "pocketjs-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
pocketjs-core = { path = "../core" }
pocket-runtime = { path = "../runtime" }
pocket-runtime-cabi = { path = "../runtime-cabi" }
pocket-drivers = { path = "../drivers" }
pocket-raster = { path = "../raster" }
pocket-present = { path = "../present" }
pocket-package = { path = "../package" }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
