# pocketjs-core — the platform-agnostic retained UI core (tree, style, taffy
# layout, text, animation, draw-list emission). #![no_std] + alloc by default
# so the same crate builds for mipsel-sony-psp, wasm32-unknown-unknown and the
# host. See ../../../docs/DESIGN.md.
#
# NOTE: deliberately NOT part of any cargo workspace — cargo-psp needs
# hosts/psp to be a lone-bin standalone crate, so each crate stands alone.

[package]
name = "pocketjs-core"
version = "0.1.0"
edition = "2021"

[dependencies]
# no_std + alloc flexbox layout. Feature set verified to resolve; f32-only,
# no libm (see docs/DESIGN.md "Why these choices").
taffy = { version = "0.11", default-features = false, features = [
    "alloc",
    "taffy_tree",
    "flexbox",
    "content_size",
] }

[dev-dependencies]
# Self-dependency with `std` so `cargo test` builds the test harness against
# the std-enabled crate while normal builds stay no_std (default features off).
pocketjs-core = { path = ".", default-features = false, features = ["std"] }

[features]
default = ["glyph-skip-zero"]
# Host-test convenience: links std (and taffy's std) instead of no_std+alloc.
std = ["taffy/std"]
# Rasterize glyph cells by walking parse-time nonzero coverage spans instead
# of scanning their transparent pixels. Disable default features to retain the
# dense reference path for A/B comparisons. PSP and Nintendo 3DS use independent
# GPU glyph paths, while ESP-IDF passes resources across an ABI without the span
# index, so the core compiles span storage out on those target OSes.
glyph-skip-zero = []
# Deliberately wrong verification variant (treats coverage < 64 as
# transparent) used to prove the counterexample matrix and end-to-end hashes
# detect lost antialiasing coverage.
glyph-skip-zero-mutant = ["glyph-skip-zero"]

[[example]]
name = "glyph_span_stats"
required-features = ["std"]
