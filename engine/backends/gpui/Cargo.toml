# pocket-ui-gpui — the gpui (Metal) render backend for pocketjs-core.
#
# Selected by the desktop host; excluded from the portable default members.

[package]
name = "pocket-ui-gpui"
edition = "2024"

version.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GPUI renderer adapter for the PocketJS UI core"

[dependencies]
gpui = "0.2.2"
image = "0.25"
smallvec = "1"
pocketjs-core = { workspace = true, default-features = true }
