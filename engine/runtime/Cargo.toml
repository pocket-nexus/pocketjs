[package]
name = "pocket-runtime"
readme = "README.md"
homepage = "https://pocketjs.pocket.nexus"
documentation = "https://docs.rs/pocket-runtime"
keywords = ["pocketjs", "runtime", "embedded"]
categories = ["no-std", "gui"]
edition = "2021"
description = "PocketJS application instances, profile facts, input encoding, package admission, and frame scheduling"

version.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pocketjs-core = { workspace = true, default-features = true }
pocket-drivers = { workspace = true, default-features = true }
pocket-spec = { workspace = true, default-features = true }
pocket-package = { workspace = true, default-features = true }
pocket-render = { workspace = true, default-features = true }

[dev-dependencies]
pocket-raster = { workspace = true, default-features = true }
