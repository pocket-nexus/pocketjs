[package]
name = "pocket-render"
readme = "README.md"
homepage = "https://pocketjs.pocket.nexus"
documentation = "https://docs.rs/pocket-render"
keywords = ["pocketjs", "rendering", "drawlist"]
categories = ["no-std", "rendering"]
edition = "2021"
description = "DrawList decoding, vertex building, texture and glyph page retention, and damage tracking for PocketJS renderers"

version.workspace = true
