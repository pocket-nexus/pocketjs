[package]
name = "pocket-stage"
edition.workspace = true
description = "A low-power 3D stage that mounts Pocket apps onto authored display surfaces"

version.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
pocket-spec = { workspace = true, default-features = true }
pocket-runtime = { workspace = true, default-features = true }
pocket-drivers = { workspace = true, default-features = true }
pocket3d = { workspace = true, default-features = true }
pocket-mod = { workspace = true, default-features = true }
pocket-ui-wgpu = { workspace = true, default-features = true }
pocket-widget = { workspace = true, default-features = true }
wgpu = { workspace = true }
winit = { workspace = true }
glam = { workspace = true, features = ["std"] }
anyhow = { workspace = true }
libc = "0.2"
log = { workspace = true }
env_logger = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
pocket-profile-build.workspace = true
