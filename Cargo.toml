rquickjs = "0.12"

wgpu = "25"
winit = "0.30"
# Shared math also serves no_std consumers; desktop crates re-enable std.
glam = { version = "0.33", default-features = false }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
gltf = { version = "1.4", features = ["extras"] }
png = "0.18"
anyhow = "1"
log = "0.4"
ab_glyph = "0.2"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
env_logger = "0.11"
font8x8 = "0.3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package."pocket-solid-aot-lab"]
overflow-checks = false

[profile.release.package."pocket-solid-aot-lab"]
overflow-checks = false

[profile.dev.package."pocket-vue-sfc-lab"]
overflow-checks = false

[profile.release.package."pocket-vue-sfc-lab"]
overflow-checks = false

[profile.release.package."pocket-text"]
opt-level = "s"

[profile.release.package."pocketjs-ui-cabi"]
opt-level = "s"
codegen-units = 1

[profile.release.package."pocketjs-wasm"]
opt-level = "s"

[profile.release.package."pocketjs-3ds-core"]
opt-level = 3
codegen-units = 1

[profile.release.package."pocket-desktop-host"]
debug = false

[profile.release.package."pocket-idf-runtime"]
codegen-units = 16
opt-level = 3

[profile.release.package."pocketjs-gba"]
opt-level = 3
codegen-units = 1
overflow-checks = false
debug = 1

[profile.release.package."pocketjs-gba-bake"]
opt-level = 3
codegen-units = 1

[profile.release.package."pocketjs-ipodnano"]
opt-level = "s"
codegen-units = 1
overflow-checks = false
debug = 1

[profile.release.package."pocketjs-ipodnano-preview"]
opt-level = 3
