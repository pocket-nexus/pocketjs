# One dependency graph and lock file for all PocketJS mechanisms and programs.
# Cross targets are selected by program recipes; cargo test uses portable defaults.
[workspace]
resolver = "2"
members = [
    "platforms/gba/video",
    "platforms/posix/svc-wire",
    "platforms/rockbox/input",
    "platforms/psp/alloc",
    "platforms/psp/quickjs-alloc",
    "platforms/psp/audio",
    "platforms/psp/display",
    "platforms/psp/system",
    "platforms/psp/input",
    "platforms/psp/io",
    "platforms/vita/audio",
    "platforms/vita/input",
    "platforms/vita/net",
    "platforms/vita/io",
    "platforms/vita/system",

    "apps/solid-aot-lab",
    "apps/vue-sfc-lab",
    "devices/gles/pocket-gles",
    "devices/gles/pocket-gles1",
    "devices/gles/pocket-gles2",
    "devices/psp/pocket-psp-ge",
    "devices/psp/pocket-psp-render",
    "devices/vita/pocket-vita-gxm",
    "devices/vita/pocket-vita-render",
    "devices/web/pocket-web-render",
    "devices/web/pocket-web-wgpu",
    "engine/backends/gpui",
    "engine/core",
    "engine/crates/microts",
    "engine/crates/pocket-mod",
    "engine/crates/pocket-sim",
    "engine/crates/pocket-text",
    "engine/crates/pocket-ui-surface",
    "engine/crates/pocket-ui-wgpu",
    "engine/crates/pocket-vrm",
    "engine/crates/pocket-widget",
    "engine/drivers",
    "engine/driver-kit",
    "engine/guest-rquickjs",
    "engine/ios",
    "engine/modules/media",
    "engine/package",
    "engine/pocket3d/crates/pocket3d",
    "engine/pocket3d/crates/pocket3d-anim",
    "engine/pocket3d/crates/pocket3d-mesh",
    "engine/pocket3d/crates/pocket3d-packs",
    "engine/pocket3d/crates/pocket3d-title",
    "engine/pocket3d/crates/pocket3d-world",
    "engine/pocket3d/examples/handheld",
    "engine/pocket3d/examples/note-widget",
    "engine/pocket3d/examples/uihost",
    "engine/present",
    "engine/profile-build",
    "engine/raster",
    "engine/render/draw-ops",
    "engine/render/glyph-pages",
    "engine/render/tex-cache",
    "engine/render/tri-batch",
    "engine/runtime",
    "engine/runtime-cabi",
    "engine/spec",
    "programs/native/cabi",
    "programs/web/wasm",
    "products/3ds/core",
    "programs/desktop",
    "programs/esp-idf/archive",
    "programs/gba",
    "tools/build/gba/bake",
    "programs/ipodnano",
    "programs/ipodnano/preview",
    "programs/psp",
    "programs/vita",
    "platforms/esp-idf/render-ppa",
    "platforms/sifli/render-epic",
    "programs/sifli/archive",
    "platforms/linux/alsa",
    "platforms/linux/drm",
    "platforms/linux/evdev",
    "platforms/linux/fbdev",
    "platforms/linux/hooks",
    "programs/linux-kms",
    "programs/cardputer-zero",
    "programs/pocketbook",
]
default-members = [
    "platforms/vita/input",
    "platforms/vita/io",
    "devices/gles/pocket-gles",
    "devices/gles/pocket-gles1",
    "devices/gles/pocket-gles2",
    "devices/psp/pocket-psp-render",
    "devices/vita/pocket-vita-render",
    "devices/web/pocket-web-render",
    "devices/web/pocket-web-wgpu",
    "engine/core",
    "engine/crates/microts",
    "engine/crates/pocket-mod",
    "engine/crates/pocket-sim",
    "engine/crates/pocket-text",
    "engine/crates/pocket-ui-surface",
    "engine/crates/pocket-ui-wgpu",
    "engine/crates/pocket-vrm",
    "engine/crates/pocket-widget",
    "engine/drivers",
    "engine/driver-kit",
    "engine/guest-rquickjs",
    "engine/modules/media",
    "engine/package",
    "engine/pocket3d/crates/pocket3d",
    "engine/pocket3d/crates/pocket3d-anim",
    "engine/pocket3d/crates/pocket3d-mesh",
    "engine/pocket3d/crates/pocket3d-packs",
    "engine/pocket3d/crates/pocket3d-world",
    "engine/pocket3d/examples/handheld",
    "engine/pocket3d/examples/note-widget",
    "engine/pocket3d/examples/uihost",
    "engine/present",
    "engine/profile-build",
    "engine/raster",
    "engine/render/draw-ops",
    "engine/render/glyph-pages",
    "engine/render/tex-cache",
    "engine/render/tri-batch",
    "engine/runtime",
    "engine/runtime-cabi",
    "engine/spec",
    "platforms/esp-idf/render-ppa",
    "platforms/sifli/render-epic",
]
# Test/fuzzer harnesses keep isolated dependency graphs.
exclude = [
    "engine/package/fuzz",
    "tests/fixtures/psp-runtime",
    "tests/fixtures/vita-dev",
    "tests/fixtures/vita-runtime",
    "tools/bench-desktop/tauri/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/pocket-nexus/pocketjs"

