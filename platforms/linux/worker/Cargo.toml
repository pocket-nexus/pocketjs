[package]
name = "pocket-linux-worker"
edition = "2021"
description = "A Linux program's worker domain: engine/worker's C runner on its own thread, an http node over the program's own exchange, and the UI realm's channel bridge"
# build.rs compiles engine/worker from this repository, outside the package.
publish = false

version.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pocket-runtime = { workspace = true, default-features = true }
pocket-guest-rquickjs = { workspace = true, default-features = true }
rquickjs = { workspace = true }
serde_json = { workspace = true }
libc = "0.2.191"

[build-dependencies]
cc = "1"
serde_json = { workspace = true }
