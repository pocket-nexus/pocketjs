[package]
name = "pocket-linux-drm"
edition = "2021"
description = "PocketJS Linux drm platform unit"
publish = true

version.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pocket-drivers = { workspace = true, default-features = true }
libc = "0.2.191"
[target.'cfg(target_os = "linux")'.dependencies]
drm = { version = "0.14.1", default-features = false }

[dev-dependencies]
# The lifecycle audit renders with the software rasterizer.
pocket-driver-kit = { workspace = true, default-features = true }
pocket-raster = { workspace = true, default-features = true }
pocket-spec = { workspace = true, default-features = true }
