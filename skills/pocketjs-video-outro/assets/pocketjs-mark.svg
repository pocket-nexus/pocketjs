<!-- The PocketJS mark. This is the only drawing: tools/icons.ts rasterizes the
     whole browser and home-screen family from it, so the mark cannot drift
     between surfaces. The yellow shell is the outer silhouette, with a plum
     interior and transparent space around it. Body 28x20 rx6 stroked at
     2.6, lens r3.1 at (10,16), bars 10x2.2 and 6.5x2.2 rx1.1. The three
     arcade hues sit one per element: the shell is yellow, the screen dot and
     the short key are pink, the long key is cyan. -->
<svg viewBox="0 0 32 32" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <rect x="2" y="6" width="28" height="20" rx="6" fill="#171226" stroke="#ffd23f" stroke-width="2.6" stroke-linejoin="round"/>
  <circle cx="10" cy="16" r="3.1" fill="#ff5f9e"/>
  <rect x="16" y="12.6" width="10" height="2.2" rx="1.1" fill="#3fd0e8"/>
  <rect x="16" y="17.2" width="6.5" height="2.2" rx="1.1" fill="#ff5f9e"/>
</svg>
