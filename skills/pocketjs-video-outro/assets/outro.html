<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- The end card, in the look of the pocketjs.dev and 3d.pocket.nexus heroes
     (site/assets/landing.css, site/pocket3d/public/index.html): the near-black
     ground with soft glows in the mark's hues, the mark and the wordmark in
     Inter Tight 700, a kicker row of coloured dots, and the headline in Inter
     Tight 800 with every line after the first in the hero's gradient.
     make-outro.ts screenshots it once per layer
     (?layer=bg|logo|kicker|line-N|url); every other element keeps its box
     through `visibility: hidden`, so the layers composite back into the same
     picture. -->
<style>
  @font-face {
    font-family: "Inter Tight"; font-style: normal; font-weight: 100 900; font-display: block;
    src: url("./InterTight.ttf") format("truetype");
  }

  /* make-outro.ts sets the root font-size to 10px * scale, scale = min(W,H)/1080 */
  :root {
    font-size: 10px;
    --bg: #0b0a10; --ink: #f6f3fb; --muted: #766f8a;
    --y: #ffd23f; --p: #ff5f9e; --c: #3fd0e8; --o: #ff9f43;
    --gradient: linear-gradient(90deg, var(--y), var(--p) 55%, var(--c));
    --glow-a: rgba(255,210,63,.16); --glow-b: rgba(63,208,232,.14); --glow-c: rgba(255,95,158,.12);
  }
  /* Pocket3D's hero leads with its gold: gold to orange to pink */
  body[data-brand="pocket3d"] {
    --gradient: linear-gradient(90deg, var(--y), var(--o) 45%, var(--p));
    --glow-a: rgba(255,210,63,.18); --glow-b: rgba(255,159,67,.10); --glow-c: rgba(255,95,158,.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    position: relative; background: var(--bg); color: var(--ink);
    font-family: "Inter Tight", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  }

  /* ground: three soft glows behind the headline, as the heroes have */
  .ground { position: absolute; inset: 0;
    background:
      radial-gradient(110rem 64rem at 34% 40%, var(--glow-a), transparent 72%),
      radial-gradient(110rem 64rem at 68% 44%, var(--glow-b), transparent 72%),
      radial-gradient(96rem 56rem at 50% 64%, var(--glow-c), transparent 72%); }

  .stage { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 6rem 4rem 12rem; text-align: center; }

  /* the lockup of the sites' bars: the mark, then the name in Inter Tight 700 */
  .lockup { display: flex; align-items: center; gap: 2rem; margin-bottom: 5.6rem; }
  .lockup img { width: 8.8rem; height: 8.8rem; display: block; }
  .wordmark { font: 700 6.4rem/1 "Inter Tight", system-ui, sans-serif; letter-spacing: -.02em; white-space: nowrap; }

  /* the kicker: coloured dots and short uppercase labels above the headline */
  .kicker { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem 3.2rem; margin-bottom: 3.2rem;
    font: 600 2.4rem/1 "Inter Tight", system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .kicker span { display: inline-flex; align-items: center; gap: 1.2rem; }
  .kicker span::before { content: ""; width: 1.2rem; height: 1.2rem; border-radius: 50%; background: var(--k); }

  /* the headline: Inter Tight 800, the first line in ink, the rest in the gradient */
  .headline { font: 800 min(12.4rem, 8.6vw)/.98 "Inter Tight", system-ui, sans-serif; letter-spacing: -.045em;
    max-width: 92vw; padding-bottom: .08em; }
  .line { display: block; }
  .line + .line { background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .url { position: absolute; bottom: 6.4rem; left: 0; right: 0; text-align: center;
    font: 500 3rem/1 "Inter Tight", system-ui, sans-serif; letter-spacing: .01em; color: var(--muted); }

  /* ---- layers: one element shows, the rest keep their boxes ---- */
  body[data-layer]:not([data-layer="bg"]) { background: transparent; }
  body[data-layer]:not([data-layer="bg"]) .ground { visibility: hidden; }
  body[data-layer="bg"] :is(.lockup, .kicker, .headline, .url) { visibility: hidden; }
  body[data-layer="logo"] :is(.kicker, .headline, .url) { visibility: hidden; }
  body[data-layer="kicker"] :is(.lockup, .headline, .url) { visibility: hidden; }
  body[data-layer^="line-"] :is(.lockup, .kicker, .url, .headline) { visibility: hidden; }
  body[data-layer="url"] :is(.lockup, .kicker, .headline) { visibility: hidden; }
</style>
</head>
<body>
  <div class="ground"></div>

  <div class="stage">
    <div class="lockup"><img id="mark" alt=""><div class="wordmark" id="brand"></div></div>
    <div class="kicker" id="kicker"></div>
    <div class="headline" id="headline"></div>
  </div>

  <div class="url" id="url"></div>

  <script>
    var BRANDS = {
      pocketjs: {
        word: "PocketJS", mark: "pocketjs-mark.svg", tagline: "Modern UI.\nMinimal footprint.", url: "pocketjs.dev",
        kicker: [["Solid", "c"], ["Vue Vapor", "y"], ["Octane", "p"]],
      },
      pocket3d: {
        word: "Pocket3D", mark: "pocket3d-mark.svg", tagline: "Create 3D for\nevery machine\nyou love", url: "3d.pocket.nexus",
        kicker: [["PSP", "y"], ["Nintendo 3DS", "p"], ["PS Vita", "c"]],
      },
    };
    var p = new URLSearchParams(location.search);
    var key = (p.get("brand") || "pocketjs").toLowerCase();
    var brand = BRANDS[key] || BRANDS.pocketjs;
    document.documentElement.style.fontSize = (10 * (parseFloat(p.get("scale")) || 1)) + "px";
    document.body.dataset.brand = key;
    document.getElementById("mark").src = brand.mark;
    document.getElementById("brand").textContent = brand.word;
    document.getElementById("url").textContent = p.has("url") ? p.get("url") : brand.url;

    var kicker = document.getElementById("kicker");
    brand.kicker.forEach(function (item) {
      var span = document.createElement("span");
      span.style.setProperty("--k", "var(--" + item[1] + ")");
      span.textContent = item[0];
      kicker.appendChild(span);
    });

    // One block per authored line, so each line enters as its own layer.
    var headline = document.getElementById("headline");
    (p.has("tagline") ? p.get("tagline") : brand.tagline).split("\n").forEach(function (text, n) {
      var line = document.createElement("span");
      line.className = "line";
      line.dataset.n = n;
      line.textContent = text.replace(/\s+/g, " ").trim();
      headline.appendChild(line);
    });

    var layer = p.get("layer");
    if (layer) {
      document.body.dataset.layer = layer;
      var m = /^line-(\d+)$/.exec(layer);
      if (m) {
        var keep = document.createElement("style");
        keep.textContent = '.line[data-n="' + m[1] + '"]{visibility:visible}';
        document.head.appendChild(keep);
      }
    }
  </script>
</body>
</html>
