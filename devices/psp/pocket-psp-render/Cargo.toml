[package]
name = "pocket-psp-render"
edition = "2021"
description = "PSP GE DrawList renderer with explicit zero-copy lifetime"

version.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pocket-drivers = { workspace = true, default-features = true }
pocket-spec = { workspace = true, default-features = true }
pocket-draw-ops = { workspace = true, default-features = true }
pocket-glyph-pages = { workspace = true, default-features = true }
pocket-psp-ge = { workspace = true, default-features = true }

[target.'cfg(target_os = "psp")'.dependencies]
psp = { git = "https://github.com/pocket-nexus/rust-psp.git", rev = "2cbaf8c9bc72569c76240a1d9743de10731e5f6b", features = ["external-c-heap", "abort-only", "external-global-alloc"] }
