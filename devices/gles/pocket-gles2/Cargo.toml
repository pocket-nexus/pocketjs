[package]
name = "pocket-gles2"
edition = "2021"
description = "OpenGL ES 2 shader pipeline for PocketJS"

version.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pocket-gles = { workspace = true, default-features = true }

[dev-dependencies]
pocket-gles = { workspace = true, default-features = true, features = ["mock-gl"] }
# tests/driver_kit.rs audits the renderer lifecycle and renders its fixture scene.
pocket-driver-kit = { workspace = true, default-features = true }
pocket-drivers = { workspace = true, default-features = true }
