[package]
name = "pocket-wgpu-render"
edition = "2024"
description = "Pocket DrawList renderer on native wgpu devices"

version.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pocket-drivers = { workspace = true, default-features = true }
pocket-spec = { workspace = true, default-features = true }
pocket-render = { workspace = true, default-features = true }
wgpu = "25"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

[dev-dependencies]
# tests/gpu.rs audits the renderer lifecycle on a real device.
pocket-driver-kit = { workspace = true, default-features = true }
