[workspace]

[package]
name = "pocketjs-perf-damage"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
libc = "0.2"
pocketjs-core = { path = "../../../engine/core", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
