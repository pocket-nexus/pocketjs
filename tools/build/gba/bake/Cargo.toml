[package]
name = "pocketjs-gba-bake"
edition = "2021"

version.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PocketJS gba bake component"
publish = false

[dependencies]
# `counters` links the full-tree layout oracle: every baked frame is checked
# against a fresh solve of the whole tree on the host (device-identical math).
microts = { workspace = true, default-features = true, features = ["counters"] }
pocketjs-core = { workspace = true, default-features = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
