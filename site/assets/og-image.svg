  <path d="M0 126H1200M0 252H1200M0 378H1200M0 504H1200M120 0V630M240 0V630M360 0V630M480 0V630M600 0V630M720 0V630M840 0V630M960 0V630M1080 0V630" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

