    <tspan x="76" dy="82">screen you love</tspan>
  </text>
  <text x="82" y="452" fill="#cbbde2" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="32" font-weight="500" letter-spacing="0">
