      <stop stop-color="#ffd23f" stop-opacity="0.16"/>
      <stop offset="0.58" stop-color="#ffd23f" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffd23f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="og-right" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1200 120) rotate(154) scale(460 660)">
