<!-- The MicroTS mark: a plum tile in a yellow frame, a cyan italic μ, and a
     pink and a lilac bar on each side of it. This file is the drawing; every
     other copy is generated from it or inlines its shapes. The two stems are
     round-capped strokes and the bowl is a fill, so the bowl thins where it
     meets the right stem and leaves a notch above the foot.
     `bun tools/icons.ts microts` writes site/microts/public/favicon.svg and
     rasterizes the icon family from it. -->
