<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pocket3D social card</title>
<!-- The 1200 x 630 social card. `bun tools/icons.ts pocket3d` opens this page
     in headless Chrome and captures it as public/og-image.png. It sits beside
     public/, so the Worker does not deploy it. The mark is mark.svg itself. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@800&family=Inter:wght@500&display=block">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
/* the ground and type of 3d.pocket.nexus: near-black, soft glows in the mark's gold and pink */
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;color:#f6f3fb;background:
  radial-gradient(560px 340px at 30% 26%,rgba(255,210,63,.18),transparent 70%),
  radial-gradient(560px 340px at 74% 70%,rgba(255,95,158,.13),transparent 70%),
  radial-gradient(420px 260px at 58% 18%,rgba(63,208,232,.08),transparent 70%),#0b0a10}
.lockup{display:flex;align-items:center;gap:36px}
.lockup img{width:216px;height:216px;filter:drop-shadow(0 30px 40px rgba(0,0,0,.55))}
.word{font:800 168px/1 "Inter Tight",sans-serif;letter-spacing:-.05em;padding-bottom:.04em}
.word b{font-weight:800;background:linear-gradient(90deg,#ffe98a,#ffd23f 40%,#ffb45c 75%,#ff5f9e);-webkit-background-clip:text;background-clip:text;color:transparent}
p{font:500 40px/1.2 Inter,sans-serif;letter-spacing:-.01em;color:#a9a3b8}
</style>
</head>
<body>
  <div class="lockup"><img src="mark.svg" alt=""><div class="word">Pocket<b>3D</b></div></div>
  <p>Create 3D for every machine you love</p>
</body>
</html>
